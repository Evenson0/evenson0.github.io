name: Update Market Lab

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 12-21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-lab-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install market-data client
        run: pip install -r requirements.txt
      - name: Build market snapshot
        run: |
          python scripts/update_market_lab.py
          python scripts/update_market_statistics.py
          python scripts/update_derivatives_explorer.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/market-lab.json assets/data/market-statistics.json assets/data/derivatives-explorer.json
          git diff --cached --quiet || git commit -m "Update Market Lab data"
          git push
