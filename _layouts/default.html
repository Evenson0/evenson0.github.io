---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js"{% if site.site_theme == "dark" %} data-theme="dark"{% endif %}>
  <head>
    {% include head.html %}
    {% include head/custom.html %}
    <!-- Critical language control styles are inline so the control remains visible even with a stale stylesheet. -->
    <style>
      #site-language-item.site-language-dock {
        position:fixed !important;
        z-index:2147483000 !important;
        inset:auto 18px max(18px,env(safe-area-inset-bottom)) auto !important;
        display:flex !important;
        align-items:center !important;
        gap:10px;
        max-width:calc(100vw - 32px);
        padding:8px 10px;
        background:#fff !important;
        color:#15283d !important;
        border:1px solid #9aacc1 !important;
        border-radius:14px;
        box-shadow:0 6px 28px rgba(12,25,45,.22);
        font:600 12px/1.2 system-ui,-apple-system,sans-serif;
        visibility:visible !important;
        opacity:1 !important;
      }
      #site-language-item .site-language-dock-label {
        color:#34465b !important;
        font:600 11px/1.2 system-ui,-apple-system,sans-serif;
        white-space:nowrap;
      }
      #site-language-item .site-language-switch {display:flex !important;gap:4px;}
      #site-language-item [data-site-lang-choice] {
        position:static !important;
        display:inline-flex !important;
        align-items:center;
        justify-content:center;
        min-width:38px;
        min-height:34px;
        padding:7px 9px !important;
        margin:0 !important;
        border:1px solid transparent !important;
        border-radius:9px;
        background:transparent !important;
        color:#263e5c !important;
        font:800 12px/1 system-ui,-apple-system,sans-serif !important;
        text-decoration:none !important;
        cursor:pointer;
      }
      html[data-site-lang="fr"] #site-language-item [data-site-lang-choice="fr"],
      html[data-site-lang="en"] #site-language-item [data-site-lang-choice="en"] {
        background:#1f518a !important;
        color:#fff !important;
      }
      #site-language-item [data-site-lang-choice]:focus-visible {
        outline:3px solid #2573cd !important;outline-offset:2px;
      }
      html[data-theme="dark"] #site-language-item.site-language-dock {
        background:#172438 !important;border-color:#617794 !important;color:#eef5ff !important;
      }
      html[data-theme="dark"] #site-language-item .site-language-dock-label,
      html[data-theme="dark"] #site-language-item [data-site-lang-choice] {
        color:#f0f5ff !important;
      }
      html[data-theme="dark"][data-site-lang="fr"] #site-language-item [data-site-lang-choice="fr"],
      html[data-theme="dark"][data-site-lang="en"] #site-language-item [data-site-lang-choice="en"] {
        background:#afd2ff !important;color:#14253d !important;
      }
      @media(max-width:550px){
        #site-language-item.site-language-dock {
          right:12px !important;bottom:max(12px,env(safe-area-inset-bottom)) !important;
          padding:5px 7px;gap:6px;border-radius:12px;
        }
        #site-language-item .site-language-dock-label {font-size:10px;}
        #site-language-item [data-site-lang-choice] {min-width:33px;min-height:30px;padding:5px 6px !important;}
      }
    </style>
  </head>

  <body{% if page.tool_theme %} class="tool-experience tool-theme-{{ page.tool_theme }}"{% endif %}>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    <!-- Visible on every page, independently of the main navigation's overflow behavior. -->
    <div id="site-language-item" class="site-language-dock" role="group" aria-label="Langue du site / Site language">
      <span class="site-language-dock-label">Langue / Language</span>
      <div class="site-language-switch">
        <a class="site-language-button" data-site-lang-choice="fr" href="?lang=fr" role="button" aria-pressed="false" lang="fr" title="Français">FR</a>
        <a class="site-language-button" data-site-lang-choice="en" href="?lang=en" role="button" aria-pressed="true" lang="en" title="English">EN</a>
      </div>
    </div>

    {{ content }}

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    {% include scripts.html %}

  </body>
</html>
