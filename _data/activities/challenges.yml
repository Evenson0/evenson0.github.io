    en: "2 trips · budget and availability to be checked"
  action:
    fr: "Choisis deux villes ou régions des États-Unis que tu ne connais pas, prépare des itinéraires avec budget et formalités d'entrée vérifiés, puis réalise ces voyages si les circonstances le permettent. Note des expériences authentiques plutôt qu'une liste de lieux cochés."
    en: "Choose two US cities or regions new to you, plan itineraries with a verified budget and entry requirements, then travel if circumstances allow. Record genuine experiences rather than ticking a sightseeing list."
  why:
    fr: "Une réalisation concrète et exigeante dans le domaine : Découvrir deux endroits américains entièrement nouveaux."
