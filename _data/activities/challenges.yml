- id: ACT-202611-W1
  horizon: week
  category: fitness
  period: 2026-W45
  period_start: '2026-11-02'
  issued: '2026-11-03'
  due: '2026-11-08'
  title:
    fr: "Le premier kilomètre"
    en: "The first kilometre"
  difficulty: stretch
  effort:
    fr: "30–60 min · une sortie, échauffement compris"
    en: "30–60 min · one outing, warm-up included"
  action:
    fr: "Choisis un parcours sûr de 1 km, échauffe-toi et essaie de le parcourir en courant à ton rythme. Si nécessaire, alterne course et marche. Note la distance, ton ressenti et ce que tu ferais différemment la prochaine fois."
    en: "Choose a safe 1 km route, warm up and try to run it at a comfortable pace. Alternate running and walking if needed. Record the distance, how it felt and what you would change next time."
  why:
    fr: "Commencer une progression concrète vers 5 puis 10 km, sans chercher une performance de vitesse."
    en: "Start a real progression toward 5 km and then 10 km, without chasing a pace target."
  done_when:
    fr: "Tu as parcouru 1 km avec une portion courue et noté un bref bilan. Aucun temps minimum n'est exigé."
    en: "You covered 1 km with some running and recorded a short reflection. No minimum pace is required."
  minimum:
    fr: "Un parcours mesuré de 1 km en alternant marche et course selon ton niveau."
    en: "A measured 1 km route alternating walking and running as needed."
  stretch:
    fr: "Cours 1 km d'une traite si tu es à l'aise, sans forcer à travers une douleur."
    en: "Run 1 km continuously if comfortable, without pushing through pain."
  targets:
  - fitness-goal
  parents: &id001 []
- id: ACT-202611-W2
  horizon: week
  category: speaking
  period: 2026-W45
  period_start: '2026-11-02'
  issued: '2026-11-03'
  due: '2026-11-08'
  title:
    fr: "Expliquer les probabilités en anglais devant quelqu'un"
    en: "Explain probability live in English"
  difficulty: stretch
  effort:
    fr: "2 h · préparation et échange"
    en: "2 h · preparation and conversation"
  action:
    fr: "Prépare une explication de 8 minutes sur une idée de probabilité sans lire tes notes, présente-la en anglais à une personne et réponds à au moins deux questions imprévues."
    en: "Prepare an eight-minute explanation of a probability concept without reading your notes, deliver it in English to a real person and answer at least two unscripted questions."
  why:
    fr: "Développer la capacité de prendre la parole, pas uniquement la prononciation en solitaire."
    en: "Build the skill of speaking publicly, not just practicing pronunciation alone."
  done_when:
    fr: "Une personne a écouté l'exposé et posé des questions ; tu as noté deux pistes d'amélioration."
    en: "A person listened to your talk and asked questions; you noted two things to improve."
  minimum:
    fr: "Cinq minutes en anglais et une question spontanée."
    en: "Five minutes in English and one spontaneous question."
  stretch:
    fr: "Recommence devant trois personnes et échange dix minutes sans script."
    en: "Repeat before three people and discuss for ten minutes without a script."
  targets:
  - talk
  parents:
  - ACT-202611-Q1
- id: ACT-202611-W3
  horizon: week
  category: writing
  period: 2026-W45
  period_start: '2026-11-02'
  issued: '2026-11-03'
  due: '2026-11-08'
  title:
    fr: "Un texte entièrement écrit sans IA : qu'est-ce que le courage ?"
    en: "Write without AI: what is courage?"
  difficulty: stretch
  effort:
    fr: "3–5 h · réflexion, rédaction, relecture"
    en: "3–5 h · reflection, writing and revision"
  action:
    fr: "Écris seul un essai de 800 à 1 200 mots sur la question « Le courage consiste-t-il à agir malgré la peur ? ». Aucun outil d'IA générative pour trouver la thèse, construire le plan, rédiger ou réviser. Utilise seulement tes lectures et ton jugement ; fais lire le texte par quelqu'un si tu le souhaites."
    en: "Independently write an 800–1,200-word essay on 'Is courage acting despite fear?'. Use no generative AI to form the thesis, outline, draft or revise. Rely on your reading and judgment; optionally ask a person to read it."
  why:
    fr: "Tester ta propre voix intellectuelle sans déléguer la pensée ni la formulation."
    en: "Test your own intellectual voice without outsourcing thought or wording."
  done_when:
    fr: "Un texte personnel abouti est écrit et relu sans IA ; il peut rester privé si tu le souhaites."
    en: "A complete personal essay was written and revised without AI; it may remain private."
  minimum:
    fr: "Rédige 600 mots cohérents, entièrement sans IA."
    en: "Write 600 coherent words entirely without AI."
  stretch:
    fr: "Publie le texte tel que tu l'assumes et défends oralement ta thèse devant un lecteur."
    en: "Publish the text as your own work and defend its thesis in conversation."
  targets:
  - writing
  - books
  parents:
  - ACT-202611-M2
- id: ACT-202611-M1
  horizon: month
  category: build
  period: month-2026-11
  period_start: '2026-11-03'
  issued: '2026-11-03'
  due: '2026-11-30'
  title:
    fr: "Créer un entraînement SOA P vraiment agréable sur mobile"
    en: "Build a friendly mobile SOA P practice experience"
  difficulty: ambitious
  effort:
    fr: "15–25 h · sur le mois de novembre"
    en: "15–25 h · across November"
  action:
    fr: "Crée une première version mobile de ton outil de préparation P : navigation tactile simple, progression sauvegardée, explications lisibles, filtres par thème et mode entraînement. Intègre 15 à 20 exercices originaux ou des liens officiels, sans recopier des énoncés protégés sans autorisation. Précise qu'il s'agit d'un outil indépendant de la SOA."
    en: "Build a mobile-first version of your Exam P practice tool: easy touch navigation, saved progress, readable explanations, topic filters and practice mode. Use 15–20 original questions or official links; do not republish protected question text without permission. Clearly label it as independent from SOA."
  why:
    fr: "Créer un outil qu'un étudiant aurait réellement envie d'utiliser dans le métro ou sur téléphone."
    en: "Build a tool students would genuinely enjoy using on their phones."
  done_when:
    fr: "Un prototype utilisable sur smartphone est publié avec 15 exercices testés, sauvegarde locale et README ; une autre personne a été invitée à le tester."
    en: "A usable smartphone prototype is public with 15 tested exercises, local progress saving and a README; someone else has been invited to test it."
  minimum:
    fr: "Un prototype mobile utilisable avec 10 questions originales, corrigés et progression locale."
    en: "A usable mobile prototype with 10 original questions, explanations and local progress."
  stretch:
    fr: "Ajoute mode examen chronométré, thème sombre, FR/EN et test de navigation sur deux téléphones."
    en: "Add timed exam mode, dark mode, FR/EN and usability checks on two phones."
  targets:
  - builder
  - acas
  parents:
  - ACT-202611-H1
- id: ACT-202611-M2
  horizon: month
  category: social
  period: month-2026-11
  period_start: '2026-11-03'
  issued: '2026-11-03'
  due: '2026-11-30'
  title:
    fr: "Construire un observatoire de mon compte X sans spam"
    en: "Build a spam-free X account observatory"
  difficulty: ambitious
  effort:
    fr: "10–16 h · prototype et tableau de bord"
    en: "10–16 h · prototype and dashboard"
  action:
    fr: "Construis un petit outil en lecture seule qui suit l'évolution de ton compte X à partir d'exports autorisés ou d'une API approuvée : abonnés, impressions, publications et engagement quand ces données existent. Prévois une saisie CSV manuelle si l'API n'est pas disponible. Aucune publication, réponse, abonnement ou message automatisé."
    en: "Build a read-only tool to monitor your X account using permitted exports or approved API access: followers, impressions, posts and engagement where available. Include manual CSV input if the API is unavailable. Never automate posting, replies, follows or messages."
  why:
    fr: "Comprendre ta progression et ce qui intéresse réellement ton audience sans créer une machine à bruit."
    en: "Understand your progress and what resonates without building a noise machine."
  done_when:
    fr: "Un tableau de bord local fonctionne sur des données autorisées et produit un bilan hebdomadaire reproductible, sans publier ni conserver de secrets en clair."
    en: "A local dashboard works on permitted data and produces a reproducible weekly summary without publishing or storing plaintext secrets."
  minimum:
    fr: "Un script hors ligne qui compare deux exports CSV et décrit les variations."
    en: "An offline script that compares two CSV exports and explains the changes."
  stretch:
    fr: "Ajoute analyses par thème de publication, graphiques de tendances et tests automatisés."
    en: "Add topic-level analysis, trend charts and automated tests."
  targets:
  - audience
  - builder
  parents: *id001
- id: ACT-202611-Q1
  horizon: quarter
  category: math
  period: quarter-2026-11
  period_start: '2026-11-03'
  issued: '2026-11-03'
  due: '2027-02-02'
  title:
    fr: "Résoudre 100 questions SOA P et enrichir mon blog"
    en: "Solve 100 SOA P questions and grow my blog"
  difficulty: ambitious
  effort:
    fr: "60–100 h · préparation P et publication cumulées"
    en: "60–100 h · combined Exam P preparation and publishing"
  action:
    fr: "Travaille 100 questions des ressources officielles SOA Sample P et consigne pour chacune une solution rédigée par toi : méthode, justification, piège et référence vers l'énoncé officiel. Publie un index consultable sur le blog. Ne reproduis pas les énoncés ou les corrigés officiels sans autorisation. Vise un premier ensemble utile avant l'examen P du 16 janvier."
    en: "Work through 100 questions from official SOA Sample P resources and write your own solution for each: method, justification, common trap and link to the original question where possible. Publish a browsable blog index. Do not reproduce copyrighted prompts or official answers without permission. Aim for a useful first set before January 16."
  why:
    fr: "Transformer les exercices de préparation en une bibliothèque explicative durable et partageable."
    en: "Turn exam preparation into a lasting, shareable explanation library."
  done_when:
    fr: "Cent questions sont résolues et vérifiées, indexées dans le blog avec une explication originale et une référence conforme pour chacune."
    en: "One hundred questions are solved and checked, indexed on the blog with an original explanation and lawful reference for each."
  minimum:
    fr: "Cinquante solutions originales vérifiées et publiées dans une interface consultable, comme jalon intermédiaire."
    en: "Fifty verified original solutions published in a browsable interface as an intermediate milestone."
  stretch:
    fr: "Ajoute filtres par notion, difficulté, version FR/EN et navigation mobile reliée à ton outil P."
    en: "Add topic and difficulty filters, FR/EN versions and mobile navigation connected to your Exam P tool."
  targets:
  - acas
  - builder
  parents: *id001
- id: ACT-202611-S1
  horizon: season
  category: outdoors
  period: autumn-2026
  period_start: '2026-11-03'
  issued: '2026-11-03'
  due: '2026-11-30'
  title:
    fr: "Une vraie randonnée au Mont-Saint-Bruno"
    en: "Hike at Mont-Saint-Bruno"
  difficulty: stretch
  effort:
    fr: "Une demi-journée · transport et marche"
    en: "Half a day · travel and walk"
  action:
    fr: "Effectue la boucle pédestre du Grand-Duc (environ 3,5 km) au parc national du Mont-Saint-Bruno avant la fin de novembre, après vérification des conditions et de l'accès à la Sépaq. Profite du paysage sans écran et note trois observations. Si les conditions ne sont pas sûres, reporte la sortie au lieu de prendre un risque."
    en: "Hike the roughly 3.5 km Grand-Duc trail in Mont-Saint-Bruno National Park before November ends, checking park access and trail conditions with Sépaq first. Explore without your phone in hand and record three observations. Postpone if conditions are unsafe."
  why:
    fr: "Créer un souvenir concret hors des livres et du travail, au contact de la nature."
    en: "Create a real memory beyond work and books, outdoors."
  done_when:
    fr: "La randonnée a été réellement parcourue et trois observations personnelles ont été notées ; l'accès et la météo ont été vérifiés."
    en: "The hike was actually completed and three personal observations recorded; access and weather were checked."
  minimum:
    fr: "Parcours sûr de 1,5 km dans le même parc, selon l'état du sentier."
    en: "A safe 1.5 km route in the same park, depending on trail conditions."
  stretch:
    fr: "Invite une personne et raconte la sortie en un récit court sans IA."
    en: "Invite someone and write a short account of the outing without AI."
  targets:
  - explore
  - fitness-goal
  parents: *id001
- id: ACT-202611-H1
  horizon: halfyear
  category: build
  period: halfyear-2026-11
  period_start: '2026-11-03'
  issued: '2026-11-03'
  due: '2027-05-02'
  title:
    fr: "Livrer un outil mathématique open source que d'autres peuvent utiliser"
    en: "Ship an open-source mathematical tool others can use"
  difficulty: ambitious
  effort:
    fr: "50–70 h sur six mois · projets partagés"
    en: "50–70 h across six months · shared projects"
  action:
    fr: "Transforme un de tes prototypes mathématiques ou actuariels en outil public solide : fonctionnalités utiles, documentation, jeux de tests, exemples reproductibles et version stable. Sollicite un test extérieur et améliore l'interface selon le retour. Tu peux prolonger ton simulateur SOA P."
    en: "Turn one mathematical or actuarial prototype into a solid public tool: useful features, documentation, automated tests, reproducible examples and a stable release. Request an external usability test and improve the interface. Your Exam P app could be the foundation."
  why:
    fr: "Faire avancer un portfolio concret plutôt que multiplier les brouillons jamais terminés."
    en: "Build a concrete portfolio instead of accumulating unfinished prototypes."
  done_when:
    fr: "Une version stable et testée est en ligne, documentée et réellement utilisable sur téléphone ou ordinateur."
    en: "A stable tested version is published, documented and genuinely usable on phone or desktop."
  minimum:
    fr: "Une version étroite mais aboutie et documentée avec tests de base."
    en: "A narrow but polished documented version with basic tests."
  stretch:
    fr: "Ajoute une contribution mathématique vérifiable ou une formalisation Lean, puis sollicite une revue externe."
    en: "Add a verifiable mathematical contribution or Lean formalization, then seek outside review."
  targets:
  - builder
  - research
  parents:
  - ACT-202611-Y1
- id: ACT-202611-Y1
  horizon: year
  category: research
  period: year-2026-11
  period_start: '2026-11-03'
  issued: '2026-11-03'
  due: '2027-11-02'
  title:
    fr: "Un vrai manuscrit de recherche actuarielle"
    en: "A genuine actuarial research manuscript"
  difficulty: ambitious
  effort:
    fr: "100–150 h sur douze mois · temps cumulable"
    en: "100–150 h across twelve months · cumulative time"
  action:
    fr: "Choisis une question de tarification IARD que tu peux étudier avec données ouvertes ou synthétiques. Analyse la littérature, reproduis un résultat, compare des modèles et teste la robustesse. Rédige un working paper avec code, limites et références, puis sollicite une critique qualifiée."
    en: "Choose a P&C pricing research question answerable with open or synthetic data. Review literature, reproduce a result, compare models and test robustness. Write a working paper with code, limitations and references, then seek qualified criticism."
  why:
    fr: "Construire ton identité de chercheur indépendant en vue de futurs travaux doctoraux."
    en: "Build your independent-research identity toward doctoral work."
  done_when:
    fr: "Un working paper complet et reproductible existe et a été envoyé pour lecture critique, sans prétendre qu'il est accepté par une revue."
    en: "A complete reproducible working paper exists and has been sent for critical reading, without claiming journal acceptance."
  minimum:
    fr: "Une note technique reproductible de dix pages soumise à un lecteur critique."
    en: "A ten-page reproducible technical note sent to a critical reader."
  stretch:
    fr: "Présente les résultats à un groupe et prépare une soumission scientifique appropriée."
    en: "Present results to a group and prepare an appropriate scientific submission."
  targets:
  - research
  parents: *id001
