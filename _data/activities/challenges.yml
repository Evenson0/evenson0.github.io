- id: ACT-202611-W1
  horizon: week
  period: 2026-W45
  period_start: '2026-11-02'
  issued: '2026-11-03'
  due: '2026-11-08'
  title:
    fr: "La preuve qui résiste à la critique"
    en: "A proof that withstands criticism"
  difficulty: stretch
  effort:
    fr: "3–4 h · séances P existantes"
    en: "3–4 h · existing P sessions"
  action:
    fr: "Choisis un problème P difficile. Construis une solution plausible mais erronée, explique sa faille, puis démontre le résultat correct par deux méthodes indépendantes, dont une simulation reproductible. Fais examiner la note par une autre personne."
    en: "Choose a difficult Exam P problem. Construct a plausible but wrong solution, identify its flaw, then establish the right result using two independent methods, including a reproducible simulation. Ask someone to scrutinize your note."
  why:
    fr: "Développer un réflexe de mathématicien : démontrer, réfuter et accepter la critique."
    en: "Develop a mathematician's reflex: prove, refute and welcome criticism."
  done_when:
    fr: "Une note complète contient le faux raisonnement, la correction, deux vérifications et une demande de critique envoyée. Aucune réponse extérieure n'est exigée."
    en: "A complete note contains the false argument, correction, two checks and a critique request. No outside reply is required."
  minimum:
    fr: "Une preuve et un contre-exemple numérique expliqués et partagés pour critique."
    en: "A proof and an explained numerical counterexample shared for criticism."
  stretch:
    fr: "Publie une note pédagogique bilingue et le code de simulation sur ton blog."
    en: "Publish a bilingual teaching note and simulation code on your blog."
  targets:
  - acas
  parents: &id001 []
- id: ACT-202611-W2
  horizon: week
  period: 2026-W45
  period_start: '2026-11-02'
  issued: '2026-11-03'
  due: '2026-11-08'
  title:
    fr: "Huit minutes en anglais face à un vrai auditeur"
    en: "Eight minutes of live English"
  difficulty: stretch
  effort:
    fr: "2–3 h · préparation et échange"
    en: "2–3 h · preparation and conversation"
  action:
    fr: "Explique sans lire un texte une idée actuarielle ou mathématique pendant huit minutes en anglais à une vraie personne, puis réponds à trois questions spontanées. Consigne les moments où tu as dû improviser."
    en: "Without reading a script, explain a mathematical or actuarial idea in English for eight minutes to a real listener, then answer three unscripted questions. Reflect on moments when you had to improvise."
  why:
    fr: "Être capable de soutenir une pensée technique en anglais sous le regard d'autrui."
    en: "Practice defending a technical idea in English under real questioning."
  done_when:
    fr: "L'exposé a été donné en direct avec questions et tu as noté deux améliorations. L'enregistrement peut rester privé."
    en: "The talk was delivered live with questions and you noted two improvements. Any recording may stay private."
  minimum:
    fr: "Cinq minutes sans lire et une question spontanée."
    en: "Five minutes without reading and one spontaneous question."
  stretch:
    fr: "Présente devant trois personnes et réponds dix minutes en anglais."
    en: "Present to three people and answer questions for ten minutes in English."
  targets:
  - talk
  parents:
  - ACT-202611-Q1
- id: ACT-202611-W3
  horizon: week
  period: 2026-W45
  period_start: '2026-11-02'
  issued: '2026-11-03'
  due: '2026-11-08'
  title:
    fr: "Défendre une idée contre sa meilleure objection"
    en: "Defend an idea against its best objection"
  difficulty: stretch
  effort:
    fr: "3–4 h · lecture et écriture"
    en: "3–4 h · reading and writing"
  action:
    fr: "À partir d'Adieu ou d'une lecture philosophique, écris 600 à 800 mots : thèse précise, argument, objection charitable et réponse. Fais lire ton texte à quelqu'un en lui demandant ce qui ne convainc pas."
    en: "Using Adieu or a philosophical reading, write 600–800 words: a precise thesis, argument, fair objection and reply. Ask someone to read it and identify what fails to convince."
  why:
    fr: "Apprendre à défendre un texte devant la critique plutôt qu'à produire des notes sans risque."
    en: "Learn to defend writing against criticism instead of collecting risk-free notes."
  done_when:
    fr: "Un essai structuré a été envoyé pour critique et tu as formulé sa principale faiblesse. Aucune réponse n'est requise."
    en: "A structured essay was shared for criticism and you identified its main weakness. No reply is required."
  minimum:
    fr: "400 mots structurés avec objection réelle, transmis à un lecteur."
    en: "400 structured words with a genuine objection, shared with a reader."
  stretch:
    fr: "Publie une version bilingue, révisée et sourcée sur ton blog."
    en: "Publish a revised, sourced, bilingual version on your blog."
  targets:
  - books
  - writing
  parents:
  - ACT-202611-M2
- id: ACT-202611-M1
  horizon: month
  period: month-2026-11
  period_start: '2026-11-03'
  issued: '2026-11-03'
  due: '2026-11-30'
  title:
    fr: "Une étude actuarielle reproductible de bout en bout"
    en: "A reproducible actuarial study"
  difficulty: ambitious
  effort:
    fr: "12–16 h · séances de recherche"
    en: "12–16 h · research sessions"
  action:
    fr: "Sur données ouvertes ou synthétiques, implémente un GLM de fréquence avec offset d'exposition et un modèle comparatif. Évalue-les hors échantillon, examine un diagnostic et publie code, résultats, limites et procédure de reproduction. Aucune donnée employeur."
    en: "Using open or synthetic data, implement a frequency GLM with an exposure offset and a comparator. Evaluate out of sample, examine a diagnostic and publish code, results, limitations and reproduction instructions. No employer data."
  why:
    fr: "Transformer tes lectures GLM en recherche exécutable et critiquable."
    en: "Turn GLM reading into runnable, debatable research."
  done_when:
    fr: "Un dépôt public reproduit deux modèles et leur comparaison avec README et note méthodologique de deux pages."
    en: "A public repository reproduces two models and their comparison with a README and two-page methods note."
  minimum:
    fr: "Un GLM, une baseline, une mesure de validation et un exemple entièrement reproductible."
    en: "One GLM, one baseline, a validation metric and a fully reproducible example."
  stretch:
    fr: "Teste la surdispersion ou les valeurs aberrantes et sollicite une critique technique."
    en: "Test overdispersion or outliers and request technical criticism."
  targets:
  - research
  parents:
  - ACT-202611-H1
- id: ACT-202611-M2
  horizon: month
  period: month-2026-11
  period_start: '2026-11-03'
  issued: '2026-11-03'
  due: '2026-11-30'
  title:
    fr: "Publier un essai que tu es prêt à défendre"
    en: "Publish an essay you can defend"
  difficulty: ambitious
  effort:
    fr: "8–12 h · lecture et rédaction"
    en: "8–12 h · reading and writing"
  action:
    fr: "Écris 1 500 à 2 000 mots sur une question littéraire, politique ou philosophique : thèse contestable, deux sources, meilleure objection, réponse. Demande une lecture critique, révise puis publie sur ton blog."
    en: "Write 1,500–2,000 words on a literary, political or philosophical question: a debatable thesis, two sources, the strongest objection and a response. Ask for criticism, revise and publish on your blog."
  why:
    fr: "Passer d'opinions privées à une pensée signée, argumentée et exposée."
    en: "Move from private opinions to accountable, reasoned, exposed thinking."
  done_when:
    fr: "Un essai sourcé et révisé existe publiquement et une demande de critique a été envoyée."
    en: "A sourced, revised essay is public and a critique request has been sent."
  minimum:
    fr: "Publie 1 000 mots avec thèse, objection sérieuse et deux sources."
    en: "Publish 1,000 words with a thesis, serious objection and two sources."
  stretch:
    fr: "Traduis-le en anglais et soumets-le à une publication extérieure."
    en: "Translate it into English and submit it to an external publication."
  targets:
  - books
  - writing
  parents: *id001
- id: ACT-202611-Q1
  horizon: quarter
  period: quarter-2026-11
  period_start: '2026-11-03'
  issued: '2026-11-03'
  due: '2027-02-02'
  title:
    fr: "Donner une conférence de vingt minutes"
    en: "Deliver a twenty-minute talk"
  difficulty: ambitious
  effort:
    fr: "15–20 h sur 3 mois · après P"
    en: "15–20 h across 3 months · after P"
  action:
    fr: "Prépare une conférence de vingt minutes sur une idée mathématique ou actuarielle. Invite un groupe à l'écouter après le 16 janvier ; si personne n'est disponible, publie l'exposé filmé et sollicite des critiques."
    en: "Prepare a twenty-minute talk on mathematics or actuarial work. Invite a group after January 16; if nobody is available, publish the recorded talk and request criticism."
  why:
    fr: "Apprendre à soutenir publiquement des idées sérieuses."
    en: "Learn to stand behind serious ideas in public."
  done_when:
    fr: "L'exposé est donné ou publié, avec bilan des questions."
    en: "The talk is delivered or published, with a review of questions."
  minimum:
    fr: "Quinze minutes filmées et partagées pour critique."
    en: "Fifteen recorded minutes shared for criticism."
  stretch:
    fr: "Présente en anglais devant un vrai groupe."
    en: "Present in English before a live group."
  targets:
  - talk
  parents: *id001
- id: ACT-202611-S1
  horizon: season
  period: autumn-2026
  period_start: '2026-11-03'
  issued: '2026-11-03'
  due: '2026-11-30'
  title:
    fr: "Entrer seul dans un lieu d'inconnus"
    en: "Enter a room of strangers on your own"
  difficulty: stretch
  effort:
    fr: "3–5 h · avant le 30 novembre"
    en: "3–5 h · before November 30"
  action:
    fr: "Assiste seul à un événement culturel ou citoyen inhabituel. Pose une question ou échange avec une personne inconnue. Écris dix lignes sur ce que tu en as appris."
    en: "Attend an unfamiliar cultural or civic event alone. Ask a question or converse with someone new. Write ten lines on what you learned."
  why:
    fr: "Découvrir au-delà des habitudes et exercer le courage social."
    en: "Explore beyond your habits and develop social courage."
  done_when:
    fr: "Une sortie nouvelle, un échange réel et dix lignes de réflexion."
    en: "One new outing, a genuine interaction and ten lines of reflection."
  minimum:
    fr: "Assiste seul à une rencontre nouvelle et parle à une personne."
    en: "Attend a new gathering alone and talk to one person."
  stretch:
    fr: "Propose une conversation ultérieure, sans exiger de réponse."
    en: "Offer a follow-up conversation without requiring a reply."
  targets:
  - explore
  - books
  parents: *id001
- id: ACT-202611-H1
  horizon: halfyear
  period: halfyear-2026-11
  period_start: '2026-11-03'
  issued: '2026-11-03'
  due: '2027-05-02'
  title:
    fr: Une reproduction qui tient debout
    en: A reproduction that holds up
  difficulty: ambitious
  effort:
    fr: 12–20 h réparties · temps de recherche
    en: 12–20 h spread out · research time
  action:
    fr: Choisis un exemple publié de tarification GLM avec des données utilisables. Reproduis un résultat, documente
      les étapes, puis change une hypothèse et compare. Commence petit ; précise les limites.
    en: Choose a published GLM pricing example with usable data. Reproduce one result, document the steps, then
      change one assumption and compare. Start small and state the limitations.
  why:
    fr: Construire un premier travail reproductible pour ton parcours de chercheur.
    en: Build a first reproducible piece of work for your research path.
  done_when:
    fr: Un notebook exécutable, les données ou leur mode d’accès, une comparaison et une note de limites. Aucune
      nouveauté scientifique n’est présumée.
    en: An executable notebook, the data or access instructions, a comparison and a limitations note. No scientific
      novelty is assumed.
  minimum:
    fr: Un exemple restreint, reproductible de bout en bout.
    en: One narrow example reproducible end to end.
  stretch:
    fr: Demande une critique technique à un pair et consigne les corrections.
    en: Ask a peer for technical criticism and record the corrections.
  targets:
  - research
  parents:
  - ACT-202611-Y1
- id: ACT-202611-Y1
  horizon: year
  period: year-2026-11
  period_start: '2026-11-03'
  issued: '2026-11-03'
  due: '2027-11-02'
  title:
    fr: Un premier manuscrit de recherche
    en: A first research manuscript
  difficulty: ambitious
  effort:
    fr: Un projet progressif · revues trimestrielles
    en: A progressive project · quarterly reviews
  action:
    fr: À partir de la reproduction, formule une question limitée en tarification IARD. Mène une comparaison reproductible
      et rédige un document avec question, méthode, résultats et limites. Sollicite une lecture critique.
    en: Starting from the reproduction, formulate a narrow P&C pricing question. Run a reproducible comparison
      and write a document with the question, method, results and limitations. Request a critical reading.
  why:
    fr: Avancer concrètement vers l’article actuariel et ton projet de recherche, avec une ambition ajustée aux
      résultats.
    en: Make tangible progress toward an actuarial paper and your research goal, adjusting ambition to the results.
  done_when:
    fr: Un manuscrit complet et une demande de retour envoyée. Une publication acceptée n’est pas exigée et ne
      sera jamais supposée.
    en: A complete manuscript and a feedback request sent. Journal acceptance is not required and will never be
      assumed.
  minimum:
    fr: Une note technique reproductible qui répond honnêtement à une question précise.
    en: A reproducible technical note that honestly answers one precise question.
  stretch:
    fr: Après critique, prépare une version publique clairement présentée comme travail en cours.
    en: After feedback, prepare a public version clearly labeled as work in progress.
  targets:
  - research
  parents: *id001
