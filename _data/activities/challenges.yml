    fr: "Découvrir ce qu'une progression patiente permet d'accomplir physiquement."
    en: "Discover what patient physical progression can achieve."
  done_when:
    fr: "Un parcours de 10 km a été parcouru, avec le mode (course/marche) et une réflexion honnête sur le parcours."
    en: "A 10 km route was completed, recording run/walk portions and a candid reflection."
  minimum:
    fr: "Parcours 7 km à allure adaptée avec un plan réaliste pour les 10 km."
    en: "Cover 7 km at a suitable pace with a realistic plan to reach 10 km."
  stretch:
    fr: "Cours la totalité des 10 km si tu y es prêt, sans priorité donnée à la vitesse."
    en: "Run all 10 km if prepared, without prioritizing speed."
