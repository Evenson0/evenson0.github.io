    fr: "3 mois · progression graduelle, sans chrono"
    en: "3 months · gradual progression, no pace target"
  action:
    fr: "Construis une progression adaptée de 1 km à 5 km, puis jusqu'à un parcours total de 10 km. Alterne course et marche aussi longtemps que nécessaire ; choisis une surface sûre ou un tapis en hiver. Ne cherche jamais à compenser une semaine manquée par une hausse brutale de distance."
    en: "Build a suitable progression from 1 to 5 km, then a full 10 km route. Use run/walk intervals as needed; choose a safe surface or treadmill in winter. Never make up for a missed week with a sudden mileage increase."
