    en: "Grow my X account through useful ideas"
  effort:
    fr: "6–10 h · réparties sur un mois"
    en: "6–10 h · spread over a month"
  action:
    fr: "Choisis deux sujets que tu maîtrises (maths, actuariat, programmation, lecture). Publie huit contributions originales sur X avec une vraie idée ou démonstration, réponds personnellement à des discussions pertinentes et fais un bilan des statistiques disponibles. Zéro automatisation des publications ou interactions, zéro achat d'abonnés."
    en: "Choose two topics you know well (math, actuarial work, programming, reading). Publish eight original X posts containing real ideas or demonstrations, respond personally to relevant discussions and review available metrics. No automated posting or interactions and no purchased followers."
  why:
    fr: "Construire une voix publique crédible et voir quels contenus aident réellement des lecteurs."
    en: "Build a credible public voice and learn what helps real readers."
  done_when:
    fr: "Huit contributions authentiques sont publiées et une note compare la situation de départ et l'arrivée, sans exiger un nombre précis d'abonnés."
    en: "Eight genuine posts are published and a note compares starting and ending metrics without requiring a follower threshold."
  minimum:
    fr: "Quatre contributions substantielles et un bilan qualitatif de ce qui a suscité des échanges."
    en: "Four substantial posts and a qualitative account of meaningful interactions."
  stretch:
    fr: "Rédige un fil pédagogique remarquable et publie le code de ton analyse statistique."
    en: "Write a standout educational thread and publish the code behind your metrics review."
  targets:
  - audience
  parents:
  - ACT-202611-Q10
