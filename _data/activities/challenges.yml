  issued: '2026-11-03'
  due: '2027-11-02'
  difficulty: ambitious
  title:
    fr: "Cinq grandes randonnées qui restent en mémoire"
    en: "Five memorable major hikes"
  effort:
    fr: "8 à 12 journées de sortie sur un an"
    en: "8 to 12 outdoor days across a year"
  action:
    fr: "Planifie et réalise cinq randonnées majeures de difficulté progressive, dont au moins deux sorties de montagne et une aventure de plusieurs heures. Choisis des sentiers ouverts, consulte la météo, prépare équipement, sécurité et transport, et préserve les milieux naturels."
    en: "Plan and complete five progressively more challenging hikes, including at least two mountain outings and one multi-hour adventure. Choose open trails, check weather, prepare equipment, safety and transportation, and respect nature."
  why:
    fr: "Faire de « Cinq grandes randonnées qui restent en mémoire » une vraie première, vécue ou produite dans le réel."
    en: "Turn \"Five memorable major hikes\" into a genuine first, achieved in the real world."
  done_when:
    fr: "Cinq sorties significatives ont été réalisées et chacune possède une courte trace personnelle, avec parcours et conditions notés."
    en: "Five meaningful outings were completed, each with a personal account and recorded route and conditions."
  minimum:
    fr: "Trois belles randonnées de difficulté croissante réalisées en sécurité."
    en: "Three rewarding hikes of increasing difficulty completed safely."
  stretch:
    fr: "Ajoute une randonnée de sommet exigeante ou une sortie guidée sur deux jours, selon le niveau réel."
    en: "Add a demanding summit hike or guided two-day outing, as fitness allows."
  targets:
  - explore
