- id: ACT-202611-S1
  horizon: season
  period: autumn-2026
  period_start: '2026-11-03'
  issued: '2026-11-03'
  due: '2026-11-30'
  title:
    fr: "Entrer seul dans un lieu d'inconnus"
    en: "Enter a room of strangers on your own"
  difficulty: stretch
  effort:
    fr: "3–5 h · avant le 30 novembre"
    en: "3–5 h · before November 30"
  action:
    fr: "Assiste seul à un événement culturel ou citoyen inhabituel. Pose une question ou échange avec une personne inconnue. Écris dix lignes sur ce que tu en as appris."
    en: "Attend an unfamiliar cultural or civic event alone. Ask a question or converse with someone new. Write ten lines on what you learned."
  why:
    fr: "Découvrir au-delà des habitudes et exercer le courage social."
    en: "Explore beyond your habits and develop social courage."
  done_when:
    fr: "Une sortie nouvelle, un échange réel et dix lignes de réflexion."
    en: "One new outing, a genuine interaction and ten lines of reflection."
  minimum:
    fr: "Assiste seul à une rencontre nouvelle et parle à une personne."
    en: "Attend a new gathering alone and talk to one person."
  stretch:
    fr: "Propose une conversation ultérieure, sans exiger de réponse."
    en: "Offer a follow-up conversation without requiring a reply."
  targets:
  - explore
  - books
  parents: *id001
- id: ACT-202611-H1
  horizon: halfyear
  period: halfyear-2026-11
  period_start: '2026-11-03'
  issued: '2026-11-03'
  due: '2027-05-02'
  title:
    fr: "Livrer un outil mathématique open source robuste"
    en: "Ship a robust open-source mathematical tool"
  difficulty: ambitious
  effort:
    fr: "50–70 h sur 6 mois · effort cumulé"
    en: "50–70 h across six months · cumulative effort"
  action:
    fr: "Transforme ton étude actuarielle en outil open source : interface, installation, exemples, tests automatiques et limites documentées. Demande une revue de code externe et corrige une faiblesse."
    en: "Turn your actuarial study into an open-source tool: interface, installation, examples, automated tests and documented limitations. Request external code review and fix a weakness."
  why:
    fr: "Construire un outil que d'autres peuvent vérifier et réutiliser."
    en: "Build something others can inspect and reuse."
  done_when:
    fr: "Une version publique fonctionne avec tests, documentation, exemple reproductible et demande de revue."
    en: "A public release works with tests, documentation, reproducible example and a review request."
  minimum:
    fr: "Un outil étroit mais utilisable, testé et documenté."
    en: "A narrow but usable, tested and documented tool."
  stretch:
    fr: "Ajoute une fonction avancée ou formalise une propriété mathématique en Lean."
    en: "Add an advanced feature or formalize a mathematical property in Lean."
  targets:
  - research
  parents:
  - ACT-202611-Y1
- id: ACT-202611-Y1
  horizon: year
  period: year-2026-11
  period_start: '2026-11-03'
  issued: '2026-11-03'
  due: '2027-11-02'
  title:
    fr: "Un manuscrit digne d'une évaluation scientifique"
    en: "A manuscript worthy of scientific review"
  difficulty: ambitious
  effort:
    fr: "100–150 h sur 12 mois · travail cumulé"
    en: "100–150 h across twelve months · cumulative effort"
  action:
    fr: "Pose une question précise en tarification IARD. Critique la littérature, compare des modèles sur données autorisées, teste leur robustesse et rédige un manuscrit reproductible. Sollicite deux lecteurs qualifiés ou une évaluation scientifique."
    en: "Frame a focused P&C pricing question. Critically review literature, compare models on permitted data, test robustness and write a reproducible manuscript. Seek two qualified readers or scientific review."
  why:
    fr: "Construire un vrai dossier de recherche indépendant pour un futur doctorat."
    en: "Build genuine independent research toward future doctoral study."
  done_when:
    fr: "Un manuscrit et son code sont achevés ; une demande de revue est envoyée. L'acceptation n'est pas requise."
    en: "A manuscript and its code are complete; review has been requested. Acceptance is not required."
  minimum:
    fr: "Working paper reproductible de 10 à 15 pages, partagé pour critique."
    en: "A reproducible 10–15-page working paper shared for criticism."
  stretch:
    fr: "Prépare une soumission à une conférence ou une revue sérieuse."
    en: "Prepare a submission to a serious conference or journal."
  targets:
  - research
  parents: *id001
