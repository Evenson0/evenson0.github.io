  title:
    fr: "Créer un entraînement SOA P vraiment agréable sur mobile"
    en: "Build a friendly mobile SOA P practice experience"
  difficulty: ambitious
  effort:
    fr: "15–25 h · sur le mois de novembre"
    en: "15–25 h · across November"
  action:
    fr: "Crée une première version mobile de ton outil de préparation P : navigation tactile simple, progression sauvegardée, explications lisibles, filtres par thème et mode entraînement. Intègre 15 à 20 exercices originaux ou des liens officiels, sans recopier des énoncés protégés sans autorisation. Précise qu'il s'agit d'un outil indépendant de la SOA."
    en: "Build a mobile-first version of your Exam P practice tool: easy touch navigation, saved progress, readable explanations, topic filters and practice mode. Use 15–20 original questions or official links; do not republish protected question text without permission. Clearly label it as independent from SOA."
  why:
    fr: "Créer un outil qu'un étudiant aurait réellement envie d'utiliser dans le métro ou sur téléphone."
    en: "Build a tool students would genuinely enjoy using on their phones."
  done_when:
    fr: "Un prototype utilisable sur smartphone est publié avec 15 exercices testés, sauvegarde locale et README ; une autre personne a été invitée à le tester."
    en: "A usable smartphone prototype is public with 15 tested exercises, local progress saving and a README; someone else has been invited to test it."
  minimum:
    fr: "Un prototype mobile utilisable avec 10 questions originales, corrigés et progression locale."
    en: "A usable mobile prototype with 10 original questions, explanations and local progress."
  stretch:
    fr: "Ajoute mode examen chronométré, thème sombre, FR/EN et test de navigation sur deux téléphones."
    en: "Add timed exam mode, dark mode, FR/EN and usability checks on two phones."
  targets:
  - builder
  - acas
  parents:
  - ACT-202611-H1
- id: ACT-202611-M2
  horizon: month
  category: social
  period: month-2026-11
