- id: ACT-202611-W1
  horizon: week
  category: fitness
  period: 2026-W45
  period_start: '2026-11-02'
  issued: '2026-11-03'
  due: '2026-11-08'
  title:
    fr: "Le premier kilomètre"
    en: "The first kilometre"
  difficulty: stretch
  effort:
    fr: "30–60 min · une sortie, échauffement compris"
    en: "30–60 min · one outing, warm-up included"
  action:
    fr: "Choisis un parcours sûr de 1 km, échauffe-toi et essaie de le parcourir en courant à ton rythme. Si nécessaire, alterne course et marche. Note la distance, ton ressenti et ce que tu ferais différemment la prochaine fois."
    en: "Choose a safe 1 km route, warm up and try to run it at a comfortable pace. Alternate running and walking if needed. Record the distance, how it felt and what you would change next time."
  why:
    fr: "Commencer une progression concrète vers 5 puis 10 km, sans chercher une performance de vitesse."
    en: "Start a real progression toward 5 km and then 10 km, without chasing a pace target."
  done_when:
    fr: "Tu as parcouru 1 km avec une portion courue et noté un bref bilan. Aucun temps minimum n'est exigé."
    en: "You covered 1 km with some running and recorded a short reflection. No minimum pace is required."
  minimum:
    fr: "Un parcours mesuré de 1 km en alternant marche et course selon ton niveau."
    en: "A measured 1 km route alternating walking and running as needed."
  stretch:
    fr: "Cours 1 km d'une traite si tu es à l'aise, sans forcer à travers une douleur."
    en: "Run 1 km continuously if comfortable, without pushing through pain."
  targets:
  - fitness-goal
  parents: &id001 []
- id: ACT-202611-W2
  horizon: week
  category: speaking
  period: 2026-W45
  period_start: '2026-11-02'
  issued: '2026-11-03'
  due: '2026-11-08'
  title:
    fr: "Expliquer les probabilités en anglais devant quelqu'un"
    en: "Explain probability live in English"
  difficulty: stretch
  effort:
    fr: "2 h · préparation et échange"
    en: "2 h · preparation and conversation"
  action:
    fr: "Prépare une explication de 8 minutes sur une idée de probabilité sans lire tes notes, présente-la en anglais à une personne et réponds à au moins deux questions imprévues."
    en: "Prepare an eight-minute explanation of a probability concept without reading your notes, deliver it in English to a real person and answer at least two unscripted questions."
  why:
    fr: "Développer la capacité de prendre la parole, pas uniquement la prononciation en solitaire."
    en: "Build the skill of speaking publicly, not just practicing pronunciation alone."
  done_when:
    fr: "Une personne a écouté l'exposé et posé des questions ; tu as noté deux pistes d'amélioration."
    en: "A person listened to your talk and asked questions; you noted two things to improve."
  minimum:
    fr: "Cinq minutes en anglais et une question spontanée."
    en: "Five minutes in English and one spontaneous question."
  stretch:
    fr: "Recommence devant trois personnes et échange dix minutes sans script."
    en: "Repeat before three people and discuss for ten minutes without a script."
  targets:
  - talk
  parents:
  - ACT-202611-Q1
- id: ACT-202611-W3
  horizon: week
  category: writing
  period: 2026-W45
  period_start: '2026-11-02'
  issued: '2026-11-03'
  due: '2026-11-08'
  title:
    fr: "Un texte entièrement écrit sans IA : qu'est-ce que le courage ?"
    en: "Write without AI: what is courage?"
  difficulty: stretch
  effort:
    fr: "3–5 h · réflexion, rédaction, relecture"
    en: "3–5 h · reflection, writing and revision"
  action:
    fr: "Écris seul un essai de 800 à 1 200 mots sur la question « Le courage consiste-t-il à agir malgré la peur ? ». Aucun outil d'IA générative pour trouver la thèse, construire le plan, rédiger ou réviser. Utilise seulement tes lectures et ton jugement ; fais lire le texte par quelqu'un si tu le souhaites."
    en: "Independently write an 800–1,200-word essay on 'Is courage acting despite fear?'. Use no generative AI to form the thesis, outline, draft or revise. Rely on your reading and judgment; optionally ask a person to read it."
  why:
    fr: "Tester ta propre voix intellectuelle sans déléguer la pensée ni la formulation."
    en: "Test your own intellectual voice without outsourcing thought or wording."
  done_when:
    fr: "Un texte personnel abouti est écrit et relu sans IA ; il peut rester privé si tu le souhaites."
    en: "A complete personal essay was written and revised without AI; it may remain private."
  minimum:
    fr: "Rédige 600 mots cohérents, entièrement sans IA."
    en: "Write 600 coherent words entirely without AI."
  stretch:
    fr: "Publie le texte tel que tu l'assumes et défends oralement ta thèse devant un lecteur."
    en: "Publish the text as your own work and defend its thesis in conversation."
  targets:
  - writing
  - books
  parents:
  - ACT-202611-M2
- id: ACT-202611-M1
  horizon: month
  period: month-2026-11
  period_start: '2026-11-03'
  issued: '2026-11-03'
  due: '2026-11-30'
  title:
    fr: "Une étude actuarielle reproductible de bout en bout"
    en: "A reproducible actuarial study"
  difficulty: ambitious
  effort:
    fr: "12–16 h · séances de recherche"
    en: "12–16 h · research sessions"
  action:
    fr: "Sur données ouvertes ou synthétiques, implémente un GLM de fréquence avec offset d'exposition et un modèle comparatif. Évalue-les hors échantillon, examine un diagnostic et publie code, résultats, limites et procédure de reproduction. Aucune donnée employeur."
    en: "Using open or synthetic data, implement a frequency GLM with an exposure offset and a comparator. Evaluate out of sample, examine a diagnostic and publish code, results, limitations and reproduction instructions. No employer data."
  why:
    fr: "Transformer tes lectures GLM en recherche exécutable et critiquable."
    en: "Turn GLM reading into runnable, debatable research."
  done_when:
    fr: "Un dépôt public reproduit deux modèles et leur comparaison avec README et note méthodologique de deux pages."
    en: "A public repository reproduces two models and their comparison with a README and two-page methods note."
  minimum:
    fr: "Un GLM, une baseline, une mesure de validation et un exemple entièrement reproductible."
    en: "One GLM, one baseline, a validation metric and a fully reproducible example."
  stretch:
    fr: "Teste la surdispersion ou les valeurs aberrantes et sollicite une critique technique."
    en: "Test overdispersion or outliers and request technical criticism."
  targets:
  - research
  parents:
  - ACT-202611-H1
- id: ACT-202611-M2
  horizon: month
  period: month-2026-11
  period_start: '2026-11-03'
  issued: '2026-11-03'
  due: '2026-11-30'
  title:
    fr: "Publier un essai que tu es prêt à défendre"
    en: "Publish an essay you can defend"
  difficulty: ambitious
  effort:
    fr: "8–12 h · lecture et rédaction"
    en: "8–12 h · reading and writing"
  action:
    fr: "Écris 1 500 à 2 000 mots sur une question littéraire, politique ou philosophique : thèse contestable, deux sources, meilleure objection, réponse. Demande une lecture critique, révise puis publie sur ton blog."
    en: "Write 1,500–2,000 words on a literary, political or philosophical question: a debatable thesis, two sources, the strongest objection and a response. Ask for criticism, revise and publish on your blog."
  why:
    fr: "Passer d'opinions privées à une pensée signée, argumentée et exposée."
    en: "Move from private opinions to accountable, reasoned, exposed thinking."
  done_when:
    fr: "Un essai sourcé et révisé existe publiquement et une demande de critique a été envoyée."
    en: "A sourced, revised essay is public and a critique request has been sent."
  minimum:
    fr: "Publie 1 000 mots avec thèse, objection sérieuse et deux sources."
    en: "Publish 1,000 words with a thesis, serious objection and two sources."
  stretch:
    fr: "Traduis-le en anglais et soumets-le à une publication extérieure."
    en: "Translate it into English and submit it to an external publication."
  targets:
  - books
  - writing
  parents: *id001
- id: ACT-202611-Q1
  horizon: quarter
  period: quarter-2026-11
  period_start: '2026-11-03'
  issued: '2026-11-03'
  due: '2027-02-02'
  title:
    fr: "Donner une conférence de vingt minutes"
    en: "Deliver a twenty-minute talk"
  difficulty: ambitious
  effort:
    fr: "15–20 h sur 3 mois · après P"
    en: "15–20 h across 3 months · after P"
  action:
    fr: "Prépare une conférence de vingt minutes sur une idée mathématique ou actuarielle. Invite un groupe à l'écouter après le 16 janvier ; si personne n'est disponible, publie l'exposé filmé et sollicite des critiques."
    en: "Prepare a twenty-minute talk on mathematics or actuarial work. Invite a group after January 16; if nobody is available, publish the recorded talk and request criticism."
  why:
    fr: "Apprendre à soutenir publiquement des idées sérieuses."
    en: "Learn to stand behind serious ideas in public."
  done_when:
    fr: "L'exposé est donné ou publié, avec bilan des questions."
    en: "The talk is delivered or published, with a review of questions."
  minimum:
    fr: "Quinze minutes filmées et partagées pour critique."
    en: "Fifteen recorded minutes shared for criticism."
  stretch:
    fr: "Présente en anglais devant un vrai groupe."
    en: "Present in English before a live group."
