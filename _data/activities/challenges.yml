  issued: '2026-11-03'
  due: '2027-02-02'
  title:
    fr: "Résoudre 100 questions SOA P et enrichir mon blog"
    en: "Solve 100 SOA P questions and grow my blog"
  difficulty: ambitious
  effort:
    fr: "60–100 h · préparation P et publication cumulées"
    en: "60–100 h · combined Exam P preparation and publishing"
  action:
    fr: "Travaille 100 questions des ressources officielles SOA Sample P et consigne pour chacune une solution rédigée par toi : méthode, justification, piège et référence vers l'énoncé officiel. Publie un index consultable sur le blog. Ne reproduis pas les énoncés ou les corrigés officiels sans autorisation. Vise un premier ensemble utile avant l'examen P du 16 janvier."
    en: "Work through 100 questions from official SOA Sample P resources and write your own solution for each: method, justification, common trap and link to the original question where possible. Publish a browsable blog index. Do not reproduce copyrighted prompts or official answers without permission. Aim for a useful first set before January 16."
  why:
    fr: "Transformer les exercices de préparation en une bibliothèque explicative durable et partageable."
    en: "Turn exam preparation into a lasting, shareable explanation library."
  done_when:
    fr: "Cent questions sont résolues et vérifiées, indexées dans le blog avec une explication originale et une référence conforme pour chacune."
    en: "One hundred questions are solved and checked, indexed on the blog with an original explanation and lawful reference for each."
  minimum:
    fr: "Cinquante solutions originales vérifiées et publiées dans une interface consultable, comme jalon intermédiaire."
    en: "Fifty verified original solutions published in a browsable interface as an intermediate milestone."
  stretch:
    fr: "Ajoute filtres par notion, difficulté, version FR/EN et navigation mobile reliée à ton outil P."
    en: "Add topic and difficulty filters, FR/EN versions and mobile navigation connected to your Exam P tool."
  targets:
  - acas
  - builder
  parents:
  - ACT-202611-H1
- id: ACT-202611-S1
  horizon: season
  category: outdoors
  period: autumn-2026
  period_start: '2026-11-03'
  issued: '2026-11-03'
  due: '2026-11-30'
  title:
    fr: "Une vraie randonnée au Mont-Saint-Bruno"
    en: "Hike at Mont-Saint-Bruno"
  difficulty: stretch
  effort:
    fr: "Une demi-journée · transport et marche"
    en: "Half a day · travel and walk"
  action:
    fr: "Effectue la boucle pédestre du Grand-Duc (environ 3,5 km) au parc national du Mont-Saint-Bruno avant la fin de novembre, après vérification des conditions et de l'accès à la Sépaq. Profite du paysage sans écran et note trois observations. Si les conditions ne sont pas sûres, reporte la sortie au lieu de prendre un risque."
    en: "Hike the roughly 3.5 km Grand-Duc trail in Mont-Saint-Bruno National Park before November ends, checking park access and trail conditions with Sépaq first. Explore without your phone in hand and record three observations. Postpone if conditions are unsafe."
  why:
    fr: "Créer un souvenir concret hors des livres et du travail, au contact de la nature."
    en: "Create a real memory beyond work and books, outdoors."
  done_when:
    fr: "La randonnée a été réellement parcourue et trois observations personnelles ont été notées ; l'accès et la météo ont été vérifiés."
    en: "The hike was actually completed and three personal observations recorded; access and weather were checked."
  minimum:
    fr: "Parcours sûr de 1,5 km dans le même parc, selon l'état du sentier."
    en: "A safe 1.5 km route in the same park, depending on trail conditions."
  stretch:
    fr: "Invite une personne et raconte la sortie en un récit court sans IA."
    en: "Invite someone and write a short account of the outing without AI."
  targets:
  - explore
  - fitness-goal
  parents: []
