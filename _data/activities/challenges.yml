- id: ACT-202611-W1
  horizon: week
  category: fitness
  period: 2026-W45
  period_start: '2026-11-02'
  issued: '2026-11-03'
  due: '2026-11-08'
  title:
    fr: "Le premier kilomètre"
    en: "The first kilometre"
  difficulty: stretch
  effort:
    fr: "30–60 min · une sortie, échauffement compris"
    en: "30–60 min · one outing, warm-up included"
  action:
    fr: "Choisis un parcours sûr de 1 km, échauffe-toi et essaie de le parcourir en courant à ton rythme. Si nécessaire, alterne course et marche. Note la distance, ton ressenti et ce que tu ferais différemment la prochaine fois."
    en: "Choose a safe 1 km route, warm up and try to run it at a comfortable pace. Alternate running and walking if needed. Record the distance, how it felt and what you would change next time."
  why:
    fr: "Commencer une progression concrète vers 5 puis 10 km, sans chercher une performance de vitesse."
    en: "Start a real progression toward 5 km and then 10 km, without chasing a pace target."
  done_when:
    fr: "Tu as parcouru 1 km avec une portion courue et noté un bref bilan. Aucun temps minimum n'est exigé."
    en: "You covered 1 km with some running and recorded a short reflection. No minimum pace is required."
  minimum:
    fr: "Un parcours mesuré de 1 km en alternant marche et course selon ton niveau."
    en: "A measured 1 km route alternating walking and running as needed."
  stretch:
    fr: "Cours 1 km d'une traite si tu es à l'aise, sans forcer à travers une douleur."
    en: "Run 1 km continuously if comfortable, without pushing through pain."
  targets:
  - fitness-goal
  parents:
  - ACT-202611-M3
- id: ACT-202611-W2
  horizon: week
  category: speaking
  period: 2026-W45
  period_start: '2026-11-02'
  issued: '2026-11-03'
  due: '2026-11-08'
  title:
    fr: "Expliquer les probabilités en anglais devant quelqu'un"
    en: "Explain probability live in English"
  difficulty: stretch
  effort:
    fr: "2 h · préparation et échange"
    en: "2 h · preparation and conversation"
  action:
    fr: "Prépare une explication de 8 minutes sur une idée de probabilité sans lire tes notes, présente-la en anglais à une personne et réponds à au moins deux questions imprévues."
    en: "Prepare an eight-minute explanation of a probability concept without reading your notes, deliver it in English to a real person and answer at least two unscripted questions."
  why:
    fr: "Développer la capacité de prendre la parole, pas uniquement la prononciation en solitaire."
    en: "Build the skill of speaking publicly, not just practicing pronunciation alone."
  done_when:
    fr: "Une personne a écouté l'exposé et posé des questions ; tu as noté deux pistes d'amélioration."
    en: "A person listened to your talk and asked questions; you noted two things to improve."
  minimum:
    fr: "Cinq minutes en anglais et une question spontanée."
    en: "Five minutes in English and one spontaneous question."
  stretch:
    fr: "Recommence devant trois personnes et échange dix minutes sans script."
    en: "Repeat before three people and discuss for ten minutes without a script."
  targets:
  - talk
  parents:
  - ACT-202611-Q3
- id: ACT-202611-W3
  horizon: week
  category: writing
  period: 2026-W45
  period_start: '2026-11-02'
  issued: '2026-11-03'
  due: '2026-11-08'
  title:
    fr: "Un texte entièrement écrit sans IA : qu'est-ce que le courage ?"
    en: "Write without AI: what is courage?"
  difficulty: stretch
  effort:
    fr: "3–5 h · réflexion, rédaction, relecture"
    en: "3–5 h · reflection, writing and revision"
  action:
    fr: "Écris seul un essai de 800 à 1 200 mots sur la question « Le courage consiste-t-il à agir malgré la peur ? ». Aucun outil d'IA générative pour trouver la thèse, construire le plan, rédiger ou réviser. Utilise seulement tes lectures et ton jugement ; fais lire le texte par quelqu'un si tu le souhaites."
    en: "Independently write an 800–1,200-word essay on 'Is courage acting despite fear?'. Use no generative AI to form the thesis, outline, draft or revise. Rely on your reading and judgment; optionally ask a person to read it."
  why:
    fr: "Tester ta propre voix intellectuelle sans déléguer la pensée ni la formulation."
    en: "Test your own intellectual voice without outsourcing thought or wording."
  done_when:
    fr: "Un texte personnel abouti est écrit et relu sans IA ; il peut rester privé si tu le souhaites."
    en: "A complete personal essay was written and revised without AI; it may remain private."
  minimum:
    fr: "Rédige 600 mots cohérents, entièrement sans IA."
    en: "Write 600 coherent words entirely without AI."
  stretch:
    fr: "Publie le texte tel que tu l'assumes et défends oralement ta thèse devant un lecteur."
    en: "Publish the text as your own work and defend its thesis in conversation."
  targets:
  - writing
  - books
  parents:
  - ACT-202611-Y9
- id: ACT-202611-M1
