  - research
  parents: []
- id: ACT-202611-M3
  horizon: month
  category: fitness
  period: month-2026-11
  period_start: '2026-11-03'
  issued: '2026-11-03'
  due: '2026-11-30'
  difficulty: stretch
  title:
    fr: "Atteindre les 5 km à mon rythme"
    en: "Reach 5 km at my own pace"
  effort:
    fr: "4 semaines · 2 à 3 sorties adaptées par semaine"
    en: "4 weeks · 2 to 3 suitable outings each week"
  action:
    fr: "Après ton premier kilomètre, progresse vers un parcours total de 5 km. Alterne course et marche selon ton niveau, note les sorties et privilégie une augmentation graduelle plutôt que la vitesse. Le 5 km peut se faire sur tapis si les conditions extérieures sont mauvaises."
    en: "After the first kilometre, build toward a total 5 km route. Alternate running and walking according to your level, log your outings and increase gradually rather than chasing speed. A treadmill is fine when outdoor conditions are poor."
  why:
    fr: "Passer d'une première sortie à une distance dont tu seras fier, sans brûler les étapes."
    en: "Move from a first outing to a distance you can be proud of without rushing."
  done_when:
    fr: "Un parcours de 5 km est réellement terminé, avec la part courue et la part marchée notées honnêtement."
    en: "A real 5 km route is completed with the running and walking portions recorded accurately."
  minimum:
    fr: "Termine 3 km en course/marche et note le plan pour atteindre 5 km."
    en: "Complete 3 km with run/walk intervals and record a plan for 5 km."
  stretch:
    fr: "Cours 5 km en continu seulement si ton niveau actuel le permet, sans objectif de chrono."
    en: "Run 5 km continuously only if your current fitness supports it, with no time target."
  targets:
  - fitness-goal
  parents:
  - ACT-202611-Q2
