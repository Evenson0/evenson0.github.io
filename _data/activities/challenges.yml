  done_when:
    fr: "La randonnée a été réellement parcourue et trois observations personnelles ont été notées ; l'accès et la météo ont été vérifiés."
    en: "The hike was actually completed and three personal observations recorded; access and weather were checked."
  minimum:
    fr: "Parcours sûr de 1,5 km dans le même parc, selon l'état du sentier."
    en: "A safe 1.5 km route in the same park, depending on trail conditions."
  stretch:
    fr: "Invite une personne et raconte la sortie en un récit court sans IA."
    en: "Invite someone and write a short account of the outing without AI."
  targets:
  - explore
  - fitness-goal
  parents:
  - ACT-202611-Y7
