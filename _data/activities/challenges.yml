  title:
    fr: "Faire accepter une contribution mathématique à Lean"
    en: "Contribute verified mathematics to Lean"
  effort:
    fr: "70–120 h · apprentissage et contribution"
    en: "70–120 h · learning and contribution"
  action:
    fr: "Choisis un lemme accessible non redondant, apprends les conventions de mathlib, prépare une preuve Lean avec tests, ouvre une proposition de contribution et traite les retours. L'acceptation des mainteneurs reste hors de ton contrôle."
    en: "Choose a useful non-duplicate lemma, learn mathlib conventions, write a tested Lean proof, open a contribution proposal and respond to review. Maintainer acceptance is beyond your control."
  why:
    fr: "Une réalisation concrète et exigeante dans le domaine : Faire accepter une contribution mathématique à Lean."
    en: "A meaningful and challenging accomplishment: Contribute verified mathematics to Lean."
  done_when:
    fr: "Une preuve Lean originale est documentée et une proposition sérieuse a été soumise aux mainteneurs ou à un pair technique."
    en: "An original documented Lean proof exists and a serious contribution proposal has been offered to maintainers or a technical peer."
  minimum:
    fr: "Formalise dix résultats simples avec tests reproductibles."
    en: "Formalize ten straightforward results with reproducible tests."
  stretch:
    fr: "Obtiens une contribution acceptée dans mathlib ou une revue technique approfondie."
    en: "Get an accepted mathlib contribution or substantial technical review."
