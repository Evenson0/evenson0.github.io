  title:
    fr: "Construire un dossier crédible pour un futur doctorat"
    en: "Build a credible future PhD application portfolio"
  effort:
    fr: "70–120 h supplémentaires selon les études"
    en: "70–120 extra hours depending on coursework"
  action:
    fr: "Suis un cours de niveau supérieur approprié si l'inscription est confirmée, produis un travail remarquable et réunis un portefeuille de recherche, résultats, notes et candidatures potentielles. Demande des retours à des professeurs sans supposer d'admission."
    en: "Take a suitable graduate-level course if registration is confirmed, produce exceptional work and assemble a research portfolio with results, notes and possible applications. Seek faculty feedback without assuming admission."
  why:
    fr: "Une réalisation concrète et exigeante dans le domaine : Construire un dossier crédible pour un futur doctorat."
    en: "A meaningful and challenging accomplishment: Build a credible future PhD application portfolio."
  done_when:
    fr: "Un projet universitaire solide et un dossier de candidature préparatoire existent, avec au moins une demande de critique envoyée."
    en: "A strong graduate-level project and preliminary application portfolio exist, with at least one critique request sent."
  minimum:
    fr: "Achève un projet théorique ou appliqué de niveau maîtrise et documente les exigences de trois programmes."
    en: "Complete a master's-level theoretical or applied project and document entry requirements for three programs."
  stretch:
    fr: "Soumets une candidature appropriée si tu réponds aux critères et si le calendrier le permet."
    en: "Submit a suitable application if eligibility and timing permit."
