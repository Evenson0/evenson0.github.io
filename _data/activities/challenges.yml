  - ACT-202611-Y4
- id: ACT-202611-S1
  horizon: season
  category: outdoors
  period: autumn-2026
  period_start: '2026-11-03'
  issued: '2026-11-03'
  due: '2026-11-30'
  title:
    fr: "Une vraie randonnée au Mont-Saint-Bruno"
    en: "Hike at Mont-Saint-Bruno"
  difficulty: stretch
  effort:
    fr: "Une demi-journée · transport et marche"
    en: "Half a day · travel and walk"
  action:
    fr: "Effectue la boucle pédestre du Grand-Duc (environ 3,5 km) au parc national du Mont-Saint-Bruno avant la fin de novembre, après vérification des conditions et de l'accès à la Sépaq. Profite du paysage sans écran et note trois observations. Si les conditions ne sont pas sûres, reporte la sortie au lieu de prendre un risque."
    en: "Hike the roughly 3.5 km Grand-Duc trail in Mont-Saint-Bruno National Park before November ends, checking park access and trail conditions with Sépaq first. Explore without your phone in hand and record three observations. Postpone if conditions are unsafe."
