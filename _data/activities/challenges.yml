- id: ACT-202611-Y12
  horizon: year
  category: build
  period: year-2026-11
  period_start: '2026-11-03'
  issued: '2026-11-03'
  due: '2027-11-02'
  difficulty: ambitious
  title:
    fr: "Lancer un outil numérique que de vrais utilisateurs apprécient"
    en: "Launch a digital tool real users appreciate"
  effort:
    fr: "100–180 h cumulées · réutilise les projets existants"
    en: "100–180 cumulative hours · reuse existing projects"
  action:
    fr: "Choisis un seul outil parmi tes prototypes, améliore l'expérience mobile, la documentation, la fiabilité et l'accessibilité. Invite dix personnes à l'essayer, observe ce qui les bloque sans collecter de données sensibles et publie une version corrigée."
    en: "Select one of your prototypes, improve its mobile experience, documentation, reliability and accessibility. Invite ten people to try it, note usability blockers without collecting sensitive data and publish a revised release."
  why:
    fr: "Une réalisation concrète et exigeante dans le domaine : Lancer un outil numérique que de vrais utilisateurs apprécient."
    en: "A meaningful and challenging accomplishment: Launch a digital tool real users appreciate."
  done_when:
    fr: "Un outil stable est disponible et une campagne de dix invitations au test a été faite ; les corrections sont consignées, même si certains invités ne répondent pas."
    en: "A stable tool is available and ten invitations to test it were sent; fixes are documented even if some invitees never reply."
  minimum:
    fr: "Un outil public vérifié par trois testeurs volontaires et amélioré selon leurs retours."
    en: "A public tool reviewed by three voluntary testers and improved from their feedback."
  stretch:
    fr: "Atteins des utilisateurs réguliers et maintiens une feuille de route transparente."
    en: "Gain recurring users and maintain a transparent roadmap."
