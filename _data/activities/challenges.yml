    en: "Turn exam preparation into a lasting, shareable explanation library."
  done_when:
    fr: "Cent questions sont résolues et vérifiées, indexées dans le blog avec une explication originale et une référence conforme pour chacune."
    en: "One hundred questions are solved and checked, indexed on the blog with an original explanation and lawful reference for each."
  minimum:
    fr: "Cinquante solutions originales vérifiées et publiées dans une interface consultable, comme jalon intermédiaire."
    en: "Fifty verified original solutions published in a browsable interface as an intermediate milestone."
  stretch:
    fr: "Ajoute filtres par notion, difficulté, version FR/EN et navigation mobile reliée à ton outil P."
    en: "Add topic and difficulty filters, FR/EN versions and mobile navigation connected to your Exam P tool."
