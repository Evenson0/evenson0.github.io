    fr: "90–130 h · pensée personnelle"
    en: "90–130 h · independent thinking"
  action:
    fr: "Rédige douze essais argumentés, un par mois, en littérature, philosophie, politique ou mathématiques. N'utilise pas l'IA pour les idées, les phrases ou les révisions de ces textes. Révise en t'appuyant sur des sources et des lecteurs réels, et publie une sélection."
    en: "Write twelve argued essays, one per month, on literature, philosophy, politics or mathematics. Do not use AI to generate ideas, prose or revisions. Revise using sources and real readers, and publish a selection."
  why:
    fr: "Une réalisation concrète et exigeante dans le domaine : Écrire douze essais originaux sans IA."
