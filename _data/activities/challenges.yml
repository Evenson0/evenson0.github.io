    en: "Ship an open-source mathematical tool others can use"
  difficulty: ambitious
  effort:
    fr: "50–70 h sur six mois · projets partagés"
    en: "50–70 h across six months · shared projects"
  action:
    fr: "Transforme un de tes prototypes mathématiques ou actuariels en outil public solide : fonctionnalités utiles, documentation, jeux de tests, exemples reproductibles et version stable. Sollicite un test extérieur et améliore l'interface selon le retour. Tu peux prolonger ton simulateur SOA P."
    en: "Turn one mathematical or actuarial prototype into a solid public tool: useful features, documentation, automated tests, reproducible examples and a stable release. Request an external usability test and improve the interface. Your Exam P app could be the foundation."
