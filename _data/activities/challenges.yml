- id: ACT-202611-Y1
  horizon: year
  category: research
  period: year-2026-11
  period_start: '2026-11-03'
  issued: '2026-11-03'
  due: '2027-11-02'
  title:
    fr: "Un vrai manuscrit de recherche actuarielle"
    en: "A genuine actuarial research manuscript"
  difficulty: ambitious
  effort:
    fr: "100–150 h sur douze mois · temps cumulable"
    en: "100–150 h across twelve months · cumulative time"
  action:
    fr: "Choisis une question de tarification IARD que tu peux étudier avec données ouvertes ou synthétiques. Analyse la littérature, reproduis un résultat, compare des modèles et teste la robustesse. Rédige un working paper avec code, limites et références, puis sollicite une critique qualifiée."
    en: "Choose a P&C pricing research question answerable with open or synthetic data. Review literature, reproduce a result, compare models and test robustness. Write a working paper with code, limitations and references, then seek qualified criticism."
  why:
    fr: "Construire ton identité de chercheur indépendant en vue de futurs travaux doctoraux."
    en: "Build your independent-research identity toward doctoral work."
  done_when:
    fr: "Un working paper complet et reproductible existe et a été envoyé pour lecture critique, sans prétendre qu'il est accepté par une revue."
    en: "A complete reproducible working paper exists and has been sent for critical reading, without claiming journal acceptance."
  minimum:
    fr: "Une note technique reproductible de dix pages soumise à un lecteur critique."
    en: "A ten-page reproducible technical note sent to a critical reader."
  stretch:
    fr: "Présente les résultats à un groupe et prépare une soumission scientifique appropriée."
    en: "Present results to a group and prepare an appropriate scientific submission."
