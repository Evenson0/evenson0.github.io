- id: ACT-202611-H2
  horizon: halfyear
  category: travel
  period: halfyear-2026-11
  period_start: '2026-11-03'
  issued: '2026-11-03'
  due: '2027-05-02'
  difficulty: ambitious
  title:
    fr: "Organiser et vivre une escapade aux États-Unis"
    en: "Plan and take a short trip to the United States"
  effort:
    fr: "6 mois de préparation · 1 à 3 jours de voyage selon budget"
    en: "Six months of planning · 1–3 travel days depending on budget"
  action:
    fr: "Choisis une ville ou un lieu américain que tu n'as pas encore exploré, fixe un budget, vérifie les formalités d'entrée et organise un court séjour ou une visite d'une journée. Réalise l'escapade si le budget, le temps et les conditions le permettent ; consigne cinq découvertes."
    en: "Choose a US city or place you have not yet explored, set a budget, check entry requirements and arrange a short stay or day trip. Take the trip if budget, time and circumstances allow; record five discoveries."
  why:
    fr: "Faire de la découverte du monde une expérience réelle, et non seulement un projet vague."
    en: "Make exploring the world a lived experience rather than a vague wish."
  done_when:
    fr: "Une visite volontaire dans un lieu nouveau aux États-Unis a été vécue et cinq observations ont été consignées ; les contraintes financières et administratives sont respectées."
    en: "A deliberate visit to a new US place took place and five observations were recorded; financial and entry requirements were respected."
  minimum:
    fr: "Un itinéraire réaliste, un budget vérifié et une date possible pour partir, sans obligation de dépenser."
