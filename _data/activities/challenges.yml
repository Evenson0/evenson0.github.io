- id: ACT-202611-W1
  horizon: week
  category: fitness
  period: 2026-W45
  period_start: '2026-11-02'
  issued: '2026-11-03'
  due: '2026-11-08'
  title:
    fr: "Le premier kilomètre"
    en: "The first kilometre"
  difficulty: stretch
  effort:
    fr: "30–60 min · une sortie, échauffement compris"
    en: "30–60 min · one outing, warm-up included"
  action:
    fr: "Choisis un parcours sûr de 1 km, échauffe-toi et essaie de le parcourir en courant à ton rythme. Si nécessaire, alterne course et marche. Note la distance, ton ressenti et ce que tu ferais différemment la prochaine fois."
    en: "Choose a safe 1 km route, warm up and try to run it at a comfortable pace. Alternate running and walking if needed. Record the distance, how it felt and what you would change next time."
  why:
    fr: "Commencer une progression concrète vers 5 puis 10 km, sans chercher une performance de vitesse."
    en: "Start a real progression toward 5 km and then 10 km, without chasing a pace target."
  done_when:
    fr: "Tu as parcouru 1 km avec une portion courue et noté un bref bilan. Aucun temps minimum n'est exigé."
    en: "You covered 1 km with some running and recorded a short reflection. No minimum pace is required."
  minimum:
    fr: "Un parcours mesuré de 1 km en alternant marche et course selon ton niveau."
    en: "A measured 1 km route alternating walking and running as needed."
  stretch:
    fr: "Cours 1 km d'une traite si tu es à l'aise, sans forcer à travers une douleur."
    en: "Run 1 km continuously if comfortable, without pushing through pain."
  targets:
  - fitness-goal
  parents:
  - ACT-202611-M3
- id: ACT-202611-W2
  horizon: week
  category: speaking
  period: 2026-W45
  period_start: '2026-11-02'
  issued: '2026-11-03'
  due: '2026-11-08'
  title:
    fr: "Expliquer les probabilités en anglais devant quelqu'un"
    en: "Explain probability live in English"
  difficulty: stretch
  effort:
    fr: "2 h · préparation et échange"
    en: "2 h · preparation and conversation"
  action:
    fr: "Prépare une explication de 8 minutes sur une idée de probabilité sans lire tes notes, présente-la en anglais à une personne et réponds à au moins deux questions imprévues."
    en: "Prepare an eight-minute explanation of a probability concept without reading your notes, deliver it in English to a real person and answer at least two unscripted questions."
  why:
    fr: "Développer la capacité de prendre la parole, pas uniquement la prononciation en solitaire."
    en: "Build the skill of speaking publicly, not just practicing pronunciation alone."
  done_when:
    fr: "Une personne a écouté l'exposé et posé des questions ; tu as noté deux pistes d'amélioration."
    en: "A person listened to your talk and asked questions; you noted two things to improve."
  minimum:
    fr: "Cinq minutes en anglais et une question spontanée."
    en: "Five minutes in English and one spontaneous question."
  stretch:
    fr: "Recommence devant trois personnes et échange dix minutes sans script."
    en: "Repeat before three people and discuss for ten minutes without a script."
  targets:
  - talk
  parents:
  - ACT-202611-Q3
- id: ACT-202611-W3
  horizon: week
  category: writing
  period: 2026-W45
  period_start: '2026-11-02'
  issued: '2026-11-03'
  due: '2026-11-08'
  title:
    fr: "Un texte entièrement écrit sans IA : qu'est-ce que le courage ?"
    en: "Write without AI: what is courage?"
  difficulty: stretch
  effort:
    fr: "3–5 h · réflexion, rédaction, relecture"
    en: "3–5 h · reflection, writing and revision"
  action:
    fr: "Écris seul un essai de 800 à 1 200 mots sur la question « Le courage consiste-t-il à agir malgré la peur ? ». Aucun outil d'IA générative pour trouver la thèse, construire le plan, rédiger ou réviser. Utilise seulement tes lectures et ton jugement ; fais lire le texte par quelqu'un si tu le souhaites."
    en: "Independently write an 800–1,200-word essay on 'Is courage acting despite fear?'. Use no generative AI to form the thesis, outline, draft or revise. Rely on your reading and judgment; optionally ask a person to read it."
  why:
    fr: "Tester ta propre voix intellectuelle sans déléguer la pensée ni la formulation."
    en: "Test your own intellectual voice without outsourcing thought or wording."
  done_when:
    fr: "Un texte personnel abouti est écrit et relu sans IA ; il peut rester privé si tu le souhaites."
    en: "A complete personal essay was written and revised without AI; it may remain private."
  minimum:
    fr: "Rédige 600 mots cohérents, entièrement sans IA."
    en: "Write 600 coherent words entirely without AI."
  stretch:
    fr: "Publie le texte tel que tu l'assumes et défends oralement ta thèse devant un lecteur."
    en: "Publish the text as your own work and defend its thesis in conversation."
  targets:
  - writing
  - books
  parents: []
- id: ACT-202611-M1
  horizon: month
  category: build
  period: month-2026-11
  period_start: '2026-11-03'
  issued: '2026-11-03'
  due: '2026-11-30'
  title:
    fr: "Créer un entraînement SOA P vraiment agréable sur mobile"
    en: "Build a friendly mobile SOA P practice experience"
  difficulty: ambitious
  effort:
    fr: "15–25 h · sur le mois de novembre"
    en: "15–25 h · across November"
  action:
    fr: "Crée une première version mobile de ton outil de préparation P : navigation tactile simple, progression sauvegardée, explications lisibles, filtres par thème et mode entraînement. Intègre 15 à 20 exercices originaux ou des liens officiels, sans recopier des énoncés protégés sans autorisation. Précise qu'il s'agit d'un outil indépendant de la SOA."
    en: "Build a mobile-first version of your Exam P practice tool: easy touch navigation, saved progress, readable explanations, topic filters and practice mode. Use 15–20 original questions or official links; do not republish protected question text without permission. Clearly label it as independent from SOA."
  why:
    fr: "Créer un outil qu'un étudiant aurait réellement envie d'utiliser dans le métro ou sur téléphone."
    en: "Build a tool students would genuinely enjoy using on their phones."
  done_when:
    fr: "Un prototype utilisable sur smartphone est publié avec 15 exercices testés, sauvegarde locale et README ; une autre personne a été invitée à le tester."
    en: "A usable smartphone prototype is public with 15 tested exercises, local progress saving and a README; someone else has been invited to test it."
  minimum:
    fr: "Un prototype mobile utilisable avec 10 questions originales, corrigés et progression locale."
    en: "A usable mobile prototype with 10 original questions, explanations and local progress."
  stretch:
    fr: "Ajoute mode examen chronométré, thème sombre, FR/EN et test de navigation sur deux téléphones."
    en: "Add timed exam mode, dark mode, FR/EN and usability checks on two phones."
  targets:
  - builder
  - acas
  parents:
  - ACT-202611-H1
- id: ACT-202611-M2
  horizon: month
  category: social
  period: month-2026-11
  period_start: '2026-11-03'
  issued: '2026-11-03'
  due: '2026-11-30'
  title:
    fr: "Construire un observatoire de mon compte X sans spam"
    en: "Build a spam-free X account observatory"
  difficulty: ambitious
  effort:
    fr: "10–16 h · prototype et tableau de bord"
    en: "10–16 h · prototype and dashboard"
  action:
    fr: "Construis un petit outil en lecture seule qui suit l'évolution de ton compte X à partir d'exports autorisés ou d'une API approuvée : abonnés, impressions, publications et engagement quand ces données existent. Prévois une saisie CSV manuelle si l'API n'est pas disponible. Aucune publication, réponse, abonnement ou message automatisé."
    en: "Build a read-only tool to monitor your X account using permitted exports or approved API access: followers, impressions, posts and engagement where available. Include manual CSV input if the API is unavailable. Never automate posting, replies, follows or messages."
  why:
    fr: "Comprendre ta progression et ce qui intéresse réellement ton audience sans créer une machine à bruit."
    en: "Understand your progress and what resonates without building a noise machine."
  done_when:
    fr: "Un tableau de bord local fonctionne sur des données autorisées et produit un bilan hebdomadaire reproductible, sans publier ni conserver de secrets en clair."
    en: "A local dashboard works on permitted data and produces a reproducible weekly summary without publishing or storing plaintext secrets."
  minimum:
    fr: "Un script hors ligne qui compare deux exports CSV et décrit les variations."
    en: "An offline script that compares two CSV exports and explains the changes."
  stretch:
    fr: "Ajoute analyses par thème de publication, graphiques de tendances et tests automatisés."
    en: "Add topic-level analysis, trend charts and automated tests."
  targets:
  - audience
  - builder
  parents:
  - ACT-202611-M4
