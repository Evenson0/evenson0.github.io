version: 1
launched: '2026-11-03'
timezone: America/Toronto
intro:
  fr: "Tous les défis de la période sont proposés. Essaie ceux qui te motivent ; le dimanche ou en fin de période, coche uniquement les réalisations réelles. Les non cochés ne sont pas des échecs."
  en: "All challenges are available for the period. Try what interests you; on Sunday or at period-end, tick only what you actually finished. Unchecked challenges are not failures."
annual_vision:
  start: '2026-11-03'
  end: '2027-11-02'
  max_focus: 3
  headline: {fr: "365 jours pour devenir quelqu'un que tu n'as jamais été", en: "365 days to do what you have never done"}
  subtitle: {fr: "Des ambitions audacieuses, des bilans sincères, des progrès réels.", en: "Bold ambitions, candid check-ins, real progress."}
mentor_note:
  fr: "Semaine du 9 au 15 novembre 2026 : 14 défis hebdomadaires disponibles, sans inscription préalable. Explore les missions qui t'intéressent ; dimanche 15 novembre, coche celles que tu as terminées et transmets le bilan dans notre conversation. Le lundi 16 novembre, les propositions de la semaine suivante s'affichent automatiquement. Même règle pour les mois, trimestres, saisons, semestres et années : une réalisation est enregistrée uniquement sur ton retour explicite ; les autres restent des propositions. Préserve sommeil, récupération et priorité à l'examen P du 16 janvier."
  en: "November 9–15, 2026: 14 weekly challenges are available without prior commitment. Try what appeals to you; on Sunday, November 15, tick what you finished and share the summary in our conversation. The following week's batch appears automatically on Monday, November 16. The same approach applies to monthly, quarterly, seasonal, six-month and annual horizons: completion is recorded only from your explicit report; the rest remain proposals. Protect sleep, recovery and your January 16 Exam P priority."
