version: 1
launched: '2026-11-03'
timezone: America/Toronto
intro:
  fr: "Tous les défis de la période sont proposés. Essaie ceux qui te motivent ; le dimanche ou en fin de période, coche uniquement les réalisations réelles. Les non cochés ne sont pas des échecs."
  en: "All challenges are available for the period. Try what interests you; on Sunday or at period-end, tick only what you actually finished. Unchecked challenges are not failures."
annual_vision:
  start: '2026-11-03'
  end: '2027-11-02'
  max_focus: 3
  headline: {fr: "365 jours pour devenir quelqu'un que tu n'as jamais été", en: "365 days to do what you have never done"}
  subtitle: {fr: "Des ambitions audacieuses, des bilans sincères, des progrès réels.", en: "Bold ambitions, candid check-ins, real progress."}
mentor_note:
  fr: "Nouveau protocole : 12 semaines, 5 épreuves progressives par semaine jusqu'au 31 janvier 2027. Chaque épreuve fixe une production contrôlable, une mesure précise et un critère de réussite. Les premiers essais servent de points de départ : seules tes vraies notes et mesures peuvent démontrer une amélioration. La semaine de P (11–17 janvier) est allégée. Les 347 anciens défis restent accessibles dans les archives ; aucun n'est un échec faute de coche."
  en: "New protocol: 12 weeks with 5 progressive trials each week through January 31, 2027. Each trial sets a verifiable output, precise metric and pass condition. Initial attempts establish baselines; only your own recorded measurements can demonstrate improvement. Exam P week (January 11–17) is lighter. The 347 previous proposals remain accessible in the archive; unchecked work is never a failure."
