intro:
  fr: "Des missions pour apprendre, créer, publier, bouger et découvrir. Choisis ce qui t'attire, puis raconte ce que tu as tenté."
  en: "Missions to learn, build, publish, move and explore. Choose what draws you in, then share what you tried."
mentor_note:
  fr: "Ton défi n'est pas d'en faire toujours plus : c'est d'oser quelque chose qui compte. Essaie un défi à la fois. P reste prioritaire jusqu'au 16 janvier, et tes choix restent libres."
  en: "Your challenge isn't to do more of everything: it's to try something that matters. Take on one at a time. Exam P stays a priority until January 16, and your choices are yours."
