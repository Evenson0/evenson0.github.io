intro:
  fr: Des défis pour apprendre, oser et vivre davantage. Une trace de ce que je choisis, de ce que je tente et
    de ce que j’en retiens.
  en: Challenges to learn, dare and experience more. A record of what I choose, what I try and what I take from
    it.
mentor_note:
  fr: "Activities doit proposer des expériences et réalisations dont Evenson sera fier dans cinq ans. Choisis au plus un défi exigeant cette semaine, selon ta disponibilité ; P reste prioritaire jusqu'au 16 janvier. L'ambition tient à la qualité, au courage et au regard critique, pas au nombre d'exercices."
  en: "Activities should propose experiences and achievements Evenson can be proud of in five years. Choose at most one demanding challenge this week as time permits; Exam P stays first until January 16. Ambition comes from quality, courage and scrutiny, not exercise counts."
