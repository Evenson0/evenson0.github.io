version: 1
launched: '2026-11-03'
timezone: America/Toronto
intro:
  fr: "Des missions pour apprendre, créer, publier, bouger et découvrir. Choisis ce qui t'attire, puis raconte ce que tu as tenté."
  en: "Missions to learn, build, publish, move and explore. Choose what draws you in, then share what you tried."
annual_vision:
  start: '2026-11-03'
  end: '2027-11-02'
  max_focus: 3
  headline: {fr: "365 jours pour devenir quelqu'un que tu n'as jamais été", en: "365 days to do what you have never done"}
  subtitle: {fr: "Des ambitions audacieuses, des choix libres, des progrès réels.", en: "Bold ambitions, free choices, real progress."}
mentor_note:
  fr: "Revue du 8 novembre 2026 : aucun statut utilisateur reçu ; le silence n'est pas un échec. Pour le 9–15 novembre, privilégie ACT-202611-W4 : transforme une erreur P en preuve écrite, simulation reproductible et note originale (3–5 h au total, en réutilisant les séances P ; réserver 1–2 h à la simulation et à la rédaction). Premier pas : choisir un exercice de ton journal d'erreurs. La preuve et le code prêts constituent le jalon intermédiaire ; la publication achève la mission. En option, ACT-2026W46-X04 : explique cette idée appliquée à un exemple d'assurance fictif, puis échange dix minutes sans script, dans l'heure d'anglais déjà prévue. Ces propositions nourrissent les ambitions annuelles d'examens et d'anglais sans additionner les mêmes heures. P reste prioritaire pour le 16 janvier 2027 ; FM reste hors du cycle. Retour simple : ID — statut — une phrase."
  en: "Review of November 8, 2026: no user status report received; silence is not failure. For November 9–15, prioritize ACT-202611-W4: turn one P mistake into a written proof, reproducible simulation and original note (3–5 h total, reusing P sessions; reserve 1–2 h for simulation and writing). First step: select an exercise from your error log. A ready proof and runnable code are the intermediate milestone; publication completes the mission. Optionally, ACT-2026W46-X04: explain this idea through a fictional insurance example, then discuss it for ten unscripted minutes within the English hour already planned. These proposals support the annual exam and English ambitions without counting the same hours twice. P remains the priority for January 16, 2027; FM stays outside the cycle. Simple reply: ID — status — one sentence."
