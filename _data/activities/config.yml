intro:
  fr: "Des missions pour apprendre, créer, publier, bouger et découvrir. Choisis ce qui t'attire, puis raconte ce que tu as tenté."
  en: "Missions to learn, build, publish, move and explore. Choose what draws you in, then share what you tried."
annual_vision:
  start: '2026-11-03'
  end: '2027-11-02'
  max_focus: 3
  headline: {fr: "365 jours pour devenir quelqu'un que tu n'as jamais été", en: "365 days to do what you have never done"}
  subtitle: {fr: "Des ambitions audacieuses, des choix libres, des progrès réels.", en: "Bold ambitions, free choices, real progress."}
mentor_note:
  fr: "365 jours pour accomplir des premières : sport, livres, anglais, actuariat, montagne, recherche et création. Choisis deux ou trois grandes ambitions pour l'année, puis une action concrète cette semaine. Le courage se mesure au chemin réellement parcouru."
  en: "365 days to achieve new firsts: endurance, books, English, exams, mountains, research and building. Choose two or three major ambitions for the year, then one concrete action this week. Courage lives in the journey you actually take."
