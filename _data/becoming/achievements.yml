# ============================================================
# LEGENDARY ACHIEVEMENTS
#
# These are the small number of long-horizon accomplishments surfaced
# prominently by Becoming.
#
# Detailed requirements belong in the corresponding domain trees.
# This file should reference the completed mastery node rather than
# duplicate its internal dependency graph.
