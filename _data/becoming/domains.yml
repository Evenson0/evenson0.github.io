- id: research
  title: Research
  title_fr: Recherche
  strategy: active
  description: Develop independent research through technical study, reproduction, original questions, research projects, and publication.
  description_fr: Développer une pratique de recherche indépendante par l'étude technique, la reproduction, les questions originales, les projets de recherche et la publication.

- id: actuarial
  title: Actuarial
  title_fr: Actuariat
  strategy: active
  description: Build actuarial competence and progress through the CAS credential pathway.
  description_fr: Développer les compétences actuarielles et progresser dans le parcours de qualification de la CAS.

- id: mathematics
  title: Mathematics
  title_fr: Mathématiques
  strategy: maintenance
  description: Develop mathematical maturity through proof, problem solving, advanced study, exposition, and investigation.
  description_fr: Développer la maturité mathématique par la preuve, la résolution de problèmes, l'étude avancée, l'exposition et l'investigation.

- id: lean
  title: Lean / Formalization
  title_fr: Lean / Formalisation
  strategy: maintenance
  description: Formalize a small amount of mathematics regularly and progress toward meaningful mathlib contributions.
  description_fr: Formaliser régulièrement une petite quantité de mathématiques et progresser vers des contributions significatives à mathlib.

- id: writing
  title: Writing
  title_fr: Écriture
  strategy: maintenance
  description: Read seriously, develop ideas, and turn them into essays, technical writing, research, and eventually books.
  description_fr: Lire sérieusement, développer des idées et les transformer en essais, textes techniques, recherches et éventuellement livres.

- id: career
  title: Career
  title_fr: Carrière
  strategy: maintenance
  description: Grow analytical ownership, technical depth, business understanding, communication, and leadership.
  description_fr: Développer l'autonomie analytique, la profondeur technique, la compréhension des affaires, la communication et le leadership.

- id: building
  title: Software Building
  title_fr: Création logicielle
  strategy: dormant
  description: Turn useful ideas into reliable software, release them, improve them, and maintain them.
  description_fr: Transformer des idées utiles en logiciels fiables, les publier, les améliorer et les maintenir.

- id: english
  title: English
  title_fr: Anglais
  strategy: maintenance
  description: Develop fluent communication across everyday, social, technical, and professional situations.
  description_fr: Développer une communication fluide dans les situations quotidiennes, sociales, techniques et professionnelles.

- id: capital
  title: Capital
  title_fr: Capital
  strategy: maintenance
  sensitive: true
  description: Build financial resilience, a disciplined investment process, and long-term investable capital.
  description_fr: Construire une résilience financière, un processus d'investissement discipliné et un capital investissable à long terme.

- id: physical
  title: Physical
  title_fr: Physique
  strategy: active
  sensitive: true
  description: Build a sustainable physical routine while progressing in body mass, strength, endurance, and hiking capacity.
  description_fr: Construire une routine physique durable tout en progressant en masse corporelle, force, endurance et capacité en randonnée.
