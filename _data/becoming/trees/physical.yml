tree: physical

title: Physical
title_fr: Physique

private_by_default: true

notes: >
  Personal progress tracking only. This roadmap does not provide medical
  advice or prescribe weight-loss rates. Exact weekly measurements,
  health information, and private observations belong in private.yml.

nodes:

  - id: physical-process
    title: Physical Process
    title_fr: Processus physique
    type: foundation
    status: in_progress
    description: >
      Build a sustainable weekly system for strength, running,
      daily movement, recovery, and private progress tracking.
    description_fr: >
      Construire un système hebdomadaire durable combinant musculation,
      course, mouvement quotidien, récupération et suivi privé de la progression.
    unlock_requirements:
      - Weekly plan defined
      - Sessions tracked privately
      - Daily movement tracked privately
      - Weekly process review completed

  - id: physical-training-consistency
    title: Training Consistency
    title_fr: Régularité de l'entraînement
    type: process
    status: in_progress
    requires:
      - physical-process
    progress:
      mode: streak
      current: 0
      target: 8
      unit: weeks
    unlock_requirements:
      - Eight substantially completed weeks
      - Weekly plan reviewed when necessary
      - Missed sessions documented without resetting long-term progress

  - id: physical-sustainable-routine
    title: Sustainable Physical Routine
    title_fr: Routine physique durable
    type: mastery
    requires:
      - physical-training-consistency
    unlock_requirements:
      - Consistent routine maintained over multiple months
      - Training adjusted when life constraints change
      - No dependence on a single short-term challenge

  - id: physical-138
    title: Starting Point — 138 kg
    title_fr: Point de départ — 138 kg
    type: physical_milestone
    status: in_progress
    description: >
      Baseline milestone for the current long-term body-mass trajectory.
      Exact personal records remain private.
    description_fr: >
      Point de référence pour la trajectoire de masse corporelle à long terme.
      Les données personnelles exactes restent privées.

  - id: physical-130
    title: 130 kg
    title_fr: 130 kg
    type: physical_milestone
    requires:
      - physical-138

  - id: physical-120
    title: 120 kg
    title_fr: 120 kg
    type: physical_milestone
    requires:
      - physical-130

  - id: physical-110
    title: 110 kg
    title_fr: 110 kg
    type: physical_milestone
    requires:
      - physical-120

  - id: physical-below-100
    title: Below 100 kg
    title_fr: Sous les 100 kg
    type: physical_milestone
    requires:
      - physical-110

  - id: physical-90
    title: 90 kg
    title_fr: 90 kg
    type: physical_milestone
    requires:
      - physical-below-100

  - id: physical-85
    title: 85 kg
    title_fr: 85 kg
    type: physical_milestone
    requires:
      - physical-90

  - id: physical-80
    title: Reach 80 kg
    title_fr: Atteindre 80 kg
    short_title: 80 kg
    type: boss
    requires:
      - physical-85
    description: >
      Reach the current user-defined long-term body-mass target.
      Reaching the number once is not considered long-term completion.
    description_fr: >
      Atteindre l'objectif de masse corporelle à long terme actuellement
      défini. Atteindre ce nombre une seule fois ne constitue pas la fin
      de la progression.

  - id: physical-target-maintenance
    title: Establish Target Maintenance
    title_fr: Stabiliser le poids cible
    type: maintenance
    requires:
      - physical-80

  - id: physical-maintenance-3m
    title: Three Months Maintained
    title_fr: Maintien pendant trois mois
    type: physical_milestone
    requires:
      - physical-target-maintenance

  - id: physical-maintenance-6m
    title: Six Months Maintained
    title_fr: Maintien pendant six mois
    type: physical_milestone
    requires:
      - physical-maintenance-3m

  - id: physical-capacity-baseline
    title: Physical Capacity Baseline
    title_fr: Évaluation de la capacité physique
    type: assessment
    status: available
    description: >
      Establish a private baseline for endurance, strength, mobility,
      and hiking capacity before defining long-term performance targets.
    description_fr: >
      Établir un point de départ privé pour l'endurance, la force,
      la mobilité et la capacité en randonnée avant de fixer des
      objectifs de performance à long terme.

  - id: physical-endurance
    title: Endurance Progression
    title_fr: Progression en endurance
    type: skill
    requires:
      - physical-capacity-baseline

  - id: physical-strength
    title: Strength Progression
    title_fr: Progression en force
    type: skill
    requires:
      - physical-capacity-baseline

  - id: physical-hiking
    title: Hiking Capacity
    title_fr: Capacité en randonnée
    type: skill
    requires:
      - physical-capacity-baseline
    description: >
      Build the endurance and resilience required for increasingly
      demanding hikes, using completed routes to track progress.
    description_fr: >
      Développer l'endurance et la résistance nécessaires à des randonnées
      progressivement plus exigeantes en utilisant les parcours complétés
      pour suivre la progression.

  - id: physical-capacity
    title: Physical Capacity
    title_fr: Capacité physique
    type: mastery
    requires:
      - physical-endurance
      - physical-strength
      - physical-hiking

  - id: physical-transformation
    title: Physical Transformation
    title_fr: Transformation physique
    type: legendary
    requires:
      - physical-maintenance-6m
      - physical-capacity
      - physical-sustainable-routine
