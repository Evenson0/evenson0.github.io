tree: capital

title: Capital
title_fr: Capital

private_by_default: true

philosophy:
  - "Capital accumulation and investment skill are not the same thing."
  - "Portfolio growth does not automatically demonstrate investing ability."
  - "The system should reward consistency, resilience, and disciplined decision-making rather than risk taking."
  - "Exact balances, contributions, returns, liabilities, and account details remain private."
  - "All capital milestones should use one explicitly defined base currency."

notes: >
  Personal financial progress tracking only. This roadmap does not provide
  individualized investment, tax, or legal advice. Exact financial values
  belong in private.yml.

nodes:

  - id: capital-system
    title: Personal Capital System
    title_fr: Système personnel de capital
    type: foundation
    status: available

  - id: capital-policy
    title: Investment Policy Statement
    title_fr: Politique d'investissement
    type: financial_milestone
    status: available
    requires:
      - capital-system
    unlock_requirements:
      - Long-term objectives defined
      - Time horizon defined
      - Risk principles defined
      - Asset-allocation philosophy documented
      - Rebalancing rule documented
      - Strategy-change conditions documented

  - id: capital-base-currency
    title: Define the Capital Measurement Standard
    title_fr: Définir la norme de mesure du capital
    type: financial_milestone
    status: available
    requires:
      - capital-system
    unlock_requirements:
      - Base currency defined
      - Investable assets definition documented
      - Treatment of cash documented
      - Treatment of retirement accounts documented
      - Treatment of liabilities documented
      - Treatment of home equity and other illiquid assets documented

  - id: capital-liquidity-policy
    title: Emergency and Liquidity Policy
    title_fr: Politique d'urgence et de liquidité
    type: financial_milestone
    status: available
    requires:
      - capital-system
    unlock_requirements:
      - Liquidity objective defined
      - Emergency-use criteria defined
      - Replenishment rule defined

  - id: capital-liability-policy
    title: Liability Policy
    title_fr: Politique de gestion des dettes
    type: financial_milestone
    status: available
    requires:
      - capital-system
    unlock_requirements:
      - Liabilities inventoried privately
      - Priority rules documented
      - High-cost debt treatment defined
      - Borrowing principles documented

  - id: capital-resilience
    title: Financial Resilience
    title_fr: Résilience financière
    type: mastery
    requires:
      - capital-liquidity-policy
      - capital-liability-policy

  - id: capital-contribution-system
    title: Automated Contribution System
    title_fr: Système automatisé de contributions
    type: financial_milestone
    requires:
      - capital-policy
      - capital-liquidity-policy
    unlock_requirements:
      - Contribution rule defined
      - Contribution frequency defined
      - Automation used where practical
      - Contribution history tracked

  - id: capital-account-strategy
    title: Account and Tax Structure
    title_fr: Structure des comptes et fiscalité
    type: financial_milestone
    requires:
      - capital-policy
    unlock_requirements:
      - Relevant account types identified
      - Contribution limits tracked where relevant
      - Asset-location principles documented
    notes: >
      Specific tax treatment must be verified under the rules applicable
      at the time.

  - id: capital-risk-framework
    title: Investment Risk Framework
    title_fr: Cadre de gestion du risque d'investissement
    type: financial_milestone
    requires:
      - capital-policy
    unlock_requirements:
      - Concentration limits considered
      - Leverage rule documented
      - Liquidity risk considered
      - Drawdown tolerance considered
      - Speculative capital rule defined if applicable

  - id: capital-records
    title: Long-Term Investment Record
    title_fr: Historique d'investissement à long terme
    type: financial_milestone
    requires:
      - capital-contribution-system
      - capital-base-currency
    unlock_requirements:
      - Contributions tracked
      - Withdrawals tracked
      - Portfolio value tracked
      - Major decisions recorded
      - Appropriate performance measure selected
      - Benchmark defined where relevant

  - id: capital-review
    title: Periodic Capital Review
    title_fr: Revue périodique du capital
    type: maintenance
    requires:
      - capital-policy
      - capital-risk-framework
      - capital-records
      - capital-resilience
    unlock_requirements:
      - Contributions reviewed
      - Asset allocation reviewed
      - Risk rules checked
      - Liquidity checked
      - Significant strategy changes documented

  - id: capital-10k
    title: $10k Investable Assets
    title_fr: 10 k$ d'actifs investissables
    type: financial_milestone
    requires:
      - capital-base-currency

  - id: capital-25k
    title: $25k Investable Assets
    title_fr: 25 k$ d'actifs investissables
    type: financial_milestone
    requires:
      - capital-10k

  - id: capital-50k
    title: $50k Investable Assets
    title_fr: 50 k$ d'actifs investissables
    type: financial_milestone
    requires:
      - capital-25k

  - id: capital-100k
    title: $100k Investable Assets
    title_fr: 100 k$ d'actifs investissables
    type: boss
    requires:
      - capital-50k

  - id: capital-250k
    title: $250k Investable Assets
    title_fr: 250 k$ d'actifs investissables
    type: financial_milestone
    requires:
      - capital-100k

  - id: capital-500k
    title: $500k Investable Assets
    title_fr: 500 k$ d'actifs investissables
    type: boss
    requires:
      - capital-250k

  - id: capital-750k
    title: $750k Investable Assets
    title_fr: 750 k$ d'actifs investissables
    type: financial_milestone
    requires:
      - capital-500k

  - id: capital-1000k
    title: $1M Investable Assets
    title_fr: 1 M$ d'actifs investissables
    short_title: $1M
    type: legendary
    requires:
      - capital-750k
      - capital-review
      - capital-resilience
    unlock_requirements:
      - $1M investable-assets threshold reached
      - Capital definition applied consistently
      - Financial-resilience framework maintained
      - Long-term investment process established

  - id: capital-investment-journal
    title: Investment Decision Journal
    title_fr: Journal des décisions d'investissement
    type: skill
    status: available
    requires:
      - capital-policy
    unlock_requirements:
      - Thesis recorded before decision
      - Expected risks recorded
      - Disconfirming information identified
      - Exit or review conditions defined

  - id: capital-performance-measurement
    title: Measure Investment Performance Correctly
    title_fr: Mesurer correctement la performance d'investissement
    type: skill
    requires:
      - capital-records
    unlock_requirements:
      - Understand money-weighted return
      - Understand time-weighted return
      - Benchmark selected where appropriate
      - Contributions separated from investment return

  - id: capital-investment-process
    title: Disciplined Investment Process
    title_fr: Processus d'investissement discipliné
    type: mastery
    requires:
      - capital-investment-journal
      - capital-performance-measurement
      - capital-risk-framework
      - capital-review
    unlock_requirements:
      - Decisions documented prospectively
      - Risk framework followed
      - Performance measured appropriately
      - Benchmark comparisons performed
      - Mistakes reviewed
      - Strategy changes justified rather than reactive
