tree: writing

title: Writing
title_fr: Écriture

state: maintenance

philosophy:
  - Writing quality matters more than raw publication count.
  - Serious reading is part of learning to write.
  - Original essays, literary writing, technical exposition, research writing, and books are distinct forms.
  - Translations, transcriptions, summaries, and republished texts do not count as original essays.
  - A draft is not a publication.
  - A completed manuscript and a published book are distinct achievements.

nodes:

  - id: writing-craft
    title: Writing Craft
    title_fr: Pratique de l'écriture
    type: foundation
    status: in_progress
    description: >
      Develop the ability to formulate an idea, structure an argument,
      write clearly, revise seriously, and finish original work.
    unlock_requirements:
      - Formulate a clear central idea
      - Structure an argument
      - Revise for clarity and precision
      - Remove unnecessary material
      - Finish pieces rather than accumulating drafts

  - id: writing-reading-practice
    title: Serious Reading for Writing
    title_fr: Lecture attentive pour l'écriture
    type: maintenance
    status: maintenance
    description: >
      Read literature and serious nonfiction attentively enough to notice
      voice, structure, argument, rhythm, characterization, and ideas
      that can improve original writing.

  - id: writing-literary-note
    title: Literary Note
    title_fr: Note littéraire
    type: article
    status: available
    requires:
      - writing-craft
    description: >
      Turn a serious observation from reading into a short original piece
      about style, structure, character, theme, or language.

  - id: writing-literary-essay
    title: Literary Essay
    title_fr: Essai littéraire
    type: article
    requires:
      - writing-literary-note
    description: >
      Develop a substantial original argument about a literary work
      rather than producing a plot summary or ordinary review.

  - id: writing-polished-essay
    title: First Polished Original Essay
    title_fr: Premier essai original abouti
    type: article
    status: available
    requires:
      - writing-craft
    unlock_requirements:
      - Original authorship
      - Clear central question or thesis
      - Coherent structure
      - Personal reasoning
      - Substantive revision
      - Finished version

  - id: writing-essay-standard
    title: Strong Essay Standard
    title_fr: Standard d'essai solide
    type: mastery
    requires:
      - writing-polished-essay
    unlock_requirements:
      - Original argument or synthesis
      - Meaningful intellectual question
      - Clear structure
      - Revision beyond first draft
      - Responsible use of sources
      - Work worth defending publicly

  - id: writing-10-essays
    title: 10 Strong Original Essays
    title_fr: 10 essais originaux solides
    type: project
    requires:
      - writing-essay-standard
    progress:
      mode: count
      current: 0
      target: 10
      unit: qualifying essays

  - id: writing-25-essays
    title: 25 Strong Original Essays
    title_fr: 25 essais originaux solides
    type: mastery
    requires:
      - writing-10-essays
    progress:
      mode: count
      current: 0
      target: 25
      unit: qualifying essays

  - id: writing-long-form
    title: Serious Long-Form Essay
    title_fr: Essai long format substantiel
    type: project
    requires:
      - writing-polished-essay
    unlock_requirements:
      - Substantial central question
      - Research or source work where appropriate
      - Multi-section structure
      - Sustained argument
      - Full revision

  - id: writing-essayist
    title: Essayist
    title_fr: Essayiste
    type: mastery
    requires:
      - writing-25-essays
      - writing-long-form

  - id: writing-technical-exposition
    title: Technical Exposition
    title_fr: Exposition technique
    type: skill
    status: available
    requires:
      - writing-craft
    unlock_requirements:
      - Precise definitions
      - Motivation
      - Intuition
      - Examples
      - Correct notation
      - Appropriate limitations

  - id: writing-research-note
    title: Complete Research Note
    title_fr: Note de recherche complète
    type: project
    requires:
      - writing-technical-exposition
    unlock_requirements:
      - Research question
      - Relevant literature
      - Technical explanation
      - Analysis or reproduction
      - Limitations
      - Open questions
      - References

  - id: writing-research-manuscript
    title: Complete Research Manuscript
    title_fr: Manuscrit de recherche complet
    type: boss
    requires:
      - writing-research-note
      - research-work-1
    unlock_requirements:
      - Abstract
      - Introduction
      - Literature positioning
      - Methodology
      - Results
      - Discussion
      - Limitations
      - References

  - id: writing-research-writer
    title: Research Writer
    title_fr: Auteur scientifique
    type: mastery
    requires:
      - writing-research-manuscript

  - id: writing-book-thesis
    title: Book Thesis
    title_fr: Thèse du livre
    type: project
    status: dormant
    requires:
      - writing-craft
    unlock_requirements:
      - Central idea
      - Intended reader
      - Scope
      - What the book adds
      - What the book deliberately excludes

  - id: writing-book-outline
    title: Book Architecture
    title_fr: Architecture du livre
    type: project
    requires:
      - writing-book-thesis
    unlock_requirements:
      - Complete chapter outline
      - Purpose of every chapter
      - Logical progression
      - Major gaps identified

  - id: writing-sample-chapter
    title: Finished Sample Chapter
    title_fr: Premier chapitre abouti
    type: project
    requires:
      - writing-book-outline

  - id: writing-three-chapters
    title: Three Finished Chapters
    title_fr: Trois chapitres aboutis
    type: project
    requires:
      - writing-sample-chapter

  - id: writing-half-manuscript
    title: Half Manuscript
    title_fr: Moitié du manuscrit
    type: project
    requires:
      - writing-three-chapters
    progress:
      mode: percentage
      current: 0
      target: 50
      unit: manuscript

  - id: writing-first-draft
    title: Complete First Draft
    title_fr: Premier manuscrit complet
    type: boss
    requires:
      - writing-half-manuscript

  - id: writing-structural-revision
    title: Structural Revision
    title_fr: Révision structurelle
    type: project
    requires:
      - writing-first-draft

  - id: writing-external-readers
    title: External Reader Feedback
    title_fr: Retours de lecteurs externes
    type: project
    requires:
      - writing-structural-revision

  - id: writing-editorial-review
    title: Editorial Revision
    title_fr: Révision éditoriale
    type: project
    requires:
      - writing-external-readers

  - id: writing-final-manuscript
    title: Final Manuscript
    title_fr: Manuscrit final
    type: boss
    requires:
      - writing-editorial-review

  - id: writing-publication-path
    title: Choose a Publication Path
    title_fr: Choisir une voie de publication
    type: milestone
    requires:
      - writing-final-manuscript

  - id: writing-publication
    title: Book Published
    title_fr: Livre publié
    type: publication
    requires:
      - writing-publication-path

  - id: writing-published-author
    title: Published Author
    title_fr: Auteur publié
    type: legendary
    requires:
      - writing-publication
