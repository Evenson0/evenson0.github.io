tree: career

title: Career
title_fr: Carrière

state: maintenance

philosophy:
  - "Job title and professional capability are not the same thing."
  - "Career progression requires technical depth, ownership, communication, business impact, and leadership."
  - "Promotions are external outcomes; readiness can be developed before the title changes."
  - "Confidential employer information must never be required in the public roadmap."

nodes:

  - id: career-professional-development
    title: Actuarial Professional Development
    title_fr: Développement professionnel actuariel
    type: foundation
    status: maintenance

  - id: career-analyst-stage
    title: Actuarial Analyst
    title_fr: Analyste en actuariat
    type: career_stage
    status: in_progress
    requires:
      - career-professional-development

  - id: career-own-analysis
    title: Own an Analysis
    title_fr: Prendre en charge une analyse
    type: career_milestone
    status: available
    requires:
      - career-analyst-stage
    unlock_requirements:
      - Clarify the business question
      - Obtain or prepare appropriate data
      - Select a defensible method
      - Validate results
      - Form a clear conclusion

  - id: career-end-to-end
    title: Own an End-to-End Project
    title_fr: Prendre en charge un projet de bout en bout
    type: career_milestone
    requires:
      - career-own-analysis
      - career-explain-results
    unlock_requirements:
      - Define scope
      - Build project plan
      - Complete analytical work
      - Validate results
      - Communicate conclusions
      - Document methodology
      - Close or transition the project

  - id: career-multiple-projects
    title: Build a Portfolio of Owned Projects
    title_fr: Constituer un portefeuille de projets pris en charge
    type: mastery
    requires:
      - career-end-to-end
    progress:
      mode: count
      current: 0
      target: 3
      unit: substantial projects

  - id: career-explain-results
    title: Explain Results Clearly
    title_fr: Expliquer clairement les résultats
    type: career_milestone
    status: available
    requires:
      - career-analyst-stage
    unlock_requirements:
      - Explain methodology simply
      - Explain uncertainty
      - Distinguish result from interpretation
      - State limitations
      - Answer follow-up questions

  - id: career-present
    title: Present to Decision Makers
    title_fr: Présenter à des décideurs
    type: career_milestone
    requires:
      - career-explain-results
    unlock_requirements:
      - Clear recommendation or decision framing
      - Concise presentation
      - Material risks explained
      - Questions handled
      - Next action identified

  - id: career-executive-communication
    title: Executive Communication
    title_fr: Communication exécutive
    type: mastery
    requires:
      - career-present
    unlock_requirements:
      - Lead with the decision
      - Explain material financial or risk implications
      - Distinguish essential detail from technical background
      - Handle challenge without retreating into jargon

  - id: career-business-context
    title: Understand the Business Behind the Model
    title_fr: Comprendre l'entreprise derrière le modèle
    type: skill
    status: available
    requires:
      - career-analyst-stage
    unlock_requirements:
      - Identify stakeholders
      - Understand operational constraints
      - Understand financial implications
      - Explain why the analysis matters to the business

  - id: career-recommendation
    title: Make a Defensible Business Recommendation
    title_fr: Formuler une recommandation d'affaires défendable
    type: career_milestone
    requires:
      - career-end-to-end
      - career-business-context
      - career-present
    unlock_requirements:
      - Recommendation follows from the analysis
      - Alternatives considered
      - Risks identified
      - Assumptions stated
      - Expected consequence articulated

  - id: career-implemented
    title: Recommendation Implemented
    title_fr: Recommandation mise en œuvre
    type: career_milestone
    requires:
      - career-recommendation

  - id: career-impact
    title: Measure Business Impact
    title_fr: Mesurer l'impact d'affaires
    type: mastery
    requires:
      - career-implemented
    unlock_requirements:
      - Define expected outcome
      - Define measurable indicator
      - Compare outcome with expectation where possible
      - Identify unintended effects
      - Document lessons learned

  - id: career-deep-expertise
    title: Develop Deep Expertise in One Actuarial Domain
    title_fr: Développer une expertise approfondie dans un domaine actuariel
    type: skill
    status: available
    requires:
      - career-analyst-stage
    unlock_requirements:
      - Relevant technical literature studied
      - Repeated practical application
      - Able to explain methodology and limitations
      - Able to diagnose difficult cases

  - id: career-peer-review
    title: Review Another Analyst's Technical Work
    title_fr: Réviser le travail technique d'un autre analyste
    type: career_milestone
    requires:
      - career-deep-expertise
    unlock_requirements:
      - Identify assumptions
      - Detect methodological or implementation issues
      - Suggest improvements
      - Explain feedback constructively

  - id: career-resource
    title: Internal Subject-Matter Resource
    title_fr: Personne-ressource interne
    type: mastery
    requires:
      - career-deep-expertise
      - career-peer-review
      - career-multiple-projects
    unlock_requirements:
      - Repeated consultation by colleagues
      - Able to resolve non-routine questions
      - Share knowledge through documentation or explanation

  - id: career-methodology-owner
    title: Own a Technical Methodology
    title_fr: Être responsable d'une méthodologie technique
    type: boss
    requires:
      - career-resource

  - id: career-mentor
    title: Mentor Another Analyst
    title_fr: Mentorer un autre analyste
    type: career_milestone
    status: available
    requires:
      - career-explain-results

  - id: career-lead-workstream
    title: Lead a Workstream
    title_fr: Diriger un volet de travail
    type: career_milestone
    requires:
      - career-end-to-end
    unlock_requirements:
      - Define responsibilities
      - Coordinate dependencies
      - Resolve blockers
      - Maintain quality
      - Deliver expected outcome

  - id: career-cross-functional
    title: Lead Cross-Functional Work
    title_fr: Diriger un travail interfonctionnel
    type: career_milestone
    requires:
      - career-lead-workstream
      - career-business-context

  - id: career-influence
    title: Influence Without Formal Authority
    title_fr: Influencer sans autorité formelle
    type: mastery
    requires:
      - career-present
      - career-cross-functional

  - id: career-technical-leadership
    title: Technical Leadership
    title_fr: Leadership technique
    type: boss
    requires:
      - career-resource
      - career-mentor
      - career-cross-functional
      - career-influence

  - id: career-senior-readiness
    title: Senior Analyst Readiness
    title_fr: Prêt pour un rôle d'analyste senior
    type: mastery
    requires:
      - career-end-to-end
      - career-present
      - career-deep-expertise
      - career-business-context

  - id: career-senior-analyst
    title: Senior Actuarial Analyst
    title_fr: Analyste actuariel senior
    type: career_milestone
    requires:
      - career-senior-readiness

  - id: career-leadership-readiness
    title: Leadership Role Readiness
    title_fr: Prêt pour un rôle de leadership
    type: mastery
    requires:
      - career-technical-leadership
      - career-impact
      - career-executive-communication

  - id: career-director-readiness
    title: Actuarial Director Readiness
    title_fr: Prêt pour un rôle de directeur en actuariat
    type: boss
    requires:
      - career-methodology-owner
      - career-impact
      - career-executive-communication
      - career-technical-leadership
      - career-leadership-readiness
    unlock_requirements:
      - Own important actuarial decisions
      - Demonstrate measurable business impact
      - Lead substantial cross-functional work
      - Develop other analysts
      - Communicate with senior leadership
      - Exercise sound technical judgment under uncertainty

  - id: career-actuarial-director
    title: Actuarial Director
    title_fr: Directeur en actuariat
    type: legendary
    requires:
      - career-director-readiness
