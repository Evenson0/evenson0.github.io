tree: lean

title: Lean
title_fr: Lean / Formalisation

state: maintenance

source:
  organization: Lean community / mathlib
  title: Current learning and contribution guidance
  checked_at: 2026-08-28
  url: https://leanprover-community.github.io/contribute/index.html

philosophy:
  - Lean proficiency, mathematical formalization, and mathlib contribution are related but distinct capabilities.
  - A small understood formalization each week is more useful than large copied proofs.
  - Formalizing original mathematics is an advanced objective, not a prerequisite for becoming a contributor.
  - The goal is to understand formal mathematics deeply, not maximize pull-request counts.
  - AI assistance must follow current Lean and mathlib community rules.

nodes:

  - id: lean-fundamentals
    title: Lean Fundamentals
    title_fr: Fondations de Lean
    type: foundation
    status: in_progress
    description: >
      Learn enough Lean 4 to write elementary theorem statements,
      construct basic proofs, understand goals, and read common errors.
    unlock_requirements:
      - Working Lean 4 environment
      - Expressions and types
      - Propositions as types
      - Elementary theorem statements
      - Basic tactic use
      - Basic error reading

  - id: lean-theorem-proving
    title: Theorem Proving Basics
    title_fr: Bases de la démonstration en Lean
    type: learning_path
    status: available
    requires:
      - lean-fundamentals
    source:
      organization: Lean
      title: Theorem Proving in Lean 4
      checked_at: 2026-08-28
      url: https://lean-lang.org/theorem_proving_in_lean4/
    unlock_requirements:
      - Propositions and proofs
      - Quantifiers and equality
      - Basic tactics
      - Interacting with Lean
      - Several independently understood proofs

  - id: lean-mathematics-in-lean
    title: Mathematics in Lean
    title_fr: Mathematics in Lean
    type: learning_path
    requires:
      - lean-theorem-proving
    source:
      organization: Lean community
      title: Mathematics in Lean
      checked_at: 2026-08-28
      url: https://leanprover-community.github.io/mathematics_in_lean/
    unlock_requirements:
      - Calculations and rewriting
      - Logic
      - Sets and functions
      - Elementary algebraic structures
      - Exercises completed with understanding

  - id: lean-library-navigation
    title: Navigate mathlib
    title_fr: Naviguer dans mathlib
    type: skill
    requires:
      - lean-mathematics-in-lean
    unlock_requirements:
      - Find existing definitions
      - Search useful lemmas
      - Understand imports
      - Read theorem signatures
      - Recognize when a result already exists

  - id: lean-debugging
    title: Lean Debugging and Proof Repair
    title_fr: Débogage et réparation de preuves Lean
    type: skill
    requires:
      - lean-theorem-proving
    unlock_requirements:
      - Interpret common errors
      - Repair broken proofs
      - Inspect goals and context
      - Simplify unnecessary tactic chains

  - id: lean-proof-portfolio
    title: Lean Proof Portfolio
    title_fr: Portfolio de preuves Lean
    type: project
    requires:
      - lean-theorem-proving
      - lean-mathematics-in-lean
    unlock_requirements:
      - Multiple proof styles
      - At least three mathematical topics
      - Every proof explainable
      - Proofs revised when better abstractions are learned

  - id: lean-50-exercises
    title: 50 Understood Formalizations
    title_fr: 50 formalisations comprises
    type: project
    requires:
      - lean-proof-portfolio
    progress:
      mode: count
      current: 0
      target: 50
      unit: understood formalizations

  - id: lean-standalone-project
    title: Nontrivial Standalone Formalization
    title_fr: Formalisation autonome non triviale
    type: boss
    requires:
      - lean-50-exercises
      - lean-library-navigation
      - lean-debugging

  - id: lean-guidelines
    title: Understand Current mathlib Contribution Guidelines
    title_fr: Comprendre les règles actuelles de contribution à mathlib
    type: reading
    status: available
    requires:
      - lean-fundamentals
    source:
      organization: Lean community / mathlib
      checked_at: 2026-08-28
      url: https://leanprover-community.github.io/contribute/index.html
    unlock_requirements:
      - Contribution workflow understood
      - Style and naming guidance reviewed
      - Zulip workflow understood
      - Current AI policy understood

  - id: lean-community-engagement
    title: Engage with the Lean Community
    title_fr: Participer à la communauté Lean
    type: contribution
    requires:
      - lean-guidelines
    unlock_requirements:
      - Read relevant Zulip discussions
      - Understand how potential contributions are discussed
      - Ask or answer a technical question in own words when appropriate

  - id: lean-contribution-discussion
    title: Discuss a Concrete Contribution
    title_fr: Discuter d'une contribution concrète
    type: contribution
    requires:
      - lean-guidelines
      - lean-library-navigation

  - id: lean-first-small-contribution
    title: First Small mathlib Contribution
    title_fr: Première petite contribution à mathlib
    type: contribution
    requires:
      - lean-guidelines
      - lean-library-navigation

  - id: lean-first-pr
    title: First mathlib Pull Request
    title_fr: Première pull request mathlib
    type: contribution
    requires:
      - lean-first-small-contribution

  - id: lean-review-cycle
    title: Complete a mathlib Review Cycle
    title_fr: Compléter un cycle de revue mathlib
    type: contribution
    requires:
      - lean-first-pr

  - id: lean-merged-contribution
    title: First Merged mathlib Pull Request
    title_fr: Première pull request mathlib fusionnée
    type: boss
    requires:
      - lean-review-cycle

  - id: lean-multiple-contributions
    title: Multiple Meaningful mathlib Contributions
    title_fr: Plusieurs contributions significatives à mathlib
    type: mastery
    requires:
      - lean-merged-contribution
    progress:
      mode: count
      current: 0
      target: 5
      unit: meaningful merged contributions

  - id: lean-review-others
    title: Review Lean Contributions
    title_fr: Réviser des contributions Lean
    type: contribution
    requires:
      - lean-multiple-contributions

  - id: lean-contributor
    title: Lean / mathlib Contributor
    title_fr: Contributeur Lean / mathlib
    type: legendary
    requires:
      - lean-multiple-contributions

  - id: lean-own-mathematics
    title: Formalize Your Own Mathematical Work
    title_fr: Formaliser un travail mathématique personnel
    type: advanced_project
    requires:
      - lean-standalone-project
      - mathematics-original-investigation

  - id: lean-research-formalizer
    title: Formalize Original Mathematical Research
    title_fr: Formaliser une recherche mathématique originale
    type: legendary
    requires:
      - lean-contributor
      - lean-own-mathematics
