    title_fr: Synthèse sur la théorie de la crédibilité
    type: paper
    group: credibility
    status: dormant
    requires:
      - research-credibility-modern


  # ============================================================
  # RESEARCH DEVELOPMENT
  # ============================================================

  - id: research-domain-study-1
    title: First Coherent Technical Study
    title_fr: Première étude technique cohérente
    type: project
    group: research-development
    status: in_progress
    requires:
      - research-critical-reading
    description: >
      Complete one coherent technical investigation that connects
      literature, technical reconstruction, experiment, criticism,
      and synthesis.

  - id: research-r0-foundations
    title: Research Foundations
    title_fr: Fondations de recherche
    type: mastery
    group: research-development
    requires:
      - research-critical-reading
      - research-literature-map
      - research-reproduction-method
      - research-reproducibility
      - research-question-formulation
      - research-technical-writing
      - research-domain-study-1

  - id: research-reproductions-3
    title: Three Serious Reproductions
    title_fr: Trois reproductions sérieuses
    type: project
    group: research-development
    requires:
      - research-r0-foundations
    progress:
      mode: count
      current: 0
      target: 3
      unit: reproductions
    unlock_requirements:
      - Three substantial reproductions
      - At least two distinct research questions or programs
      - Each reproduction includes critical analysis


  # ============================================================
  # FIRST FIVE MAJOR RESEARCH WORKS
  # ============================================================

  - id: research-work-1
    title: Research Work I — Reproducible Study
    title_fr: Travail de recherche I — Étude reproductible
    type: project
    group: research-works
    requires:
      - research-reproductions-3
      - research-pricing-question-map
    description: >
      Complete a full independent empirical or technical study.
      The current candidate area is P&C pricing, but the precise
      question must emerge from the preceding work.
    unlock_requirements:
      - Precise research question
      - Serious literature review
      - Reproducible analysis
      - Appropriate baselines
      - Sensitivity or robustness analysis
      - Complete manuscript
      - Public preprint when appropriate

  - id: research-r1-reproducer
    title: Research Level I
    title_fr: Niveau de recherche I
    type: mastery
    group: research-works
    requires:
      - research-work-1

  - id: research-work-2
    title: Research Work II — Actuarial Journal Study
    title_fr: Travail de recherche II — Étude pour une revue actuarielle
    type: project
    group: research-works
    requires:
      - research-work-1
    description: >
      Conduct a study that goes materially beyond reproduction
      and is strong enough for formal submission to an appropriate
      peer-reviewed actuarial journal.
    unlock_requirements:
      - Clear contribution beyond reproduction
      - Critical positioning in actuarial literature
      - Strong empirical or theoretical design
      - Complete journal-standard manuscript
      - Formal peer-reviewed submission

  - id: research-r2-investigator
    title: Research Level II
    title_fr: Niveau de recherche II
    type: mastery
    group: research-works
    requires:
      - research-work-2

  - id: research-work-3
    title: Research Work III — Original Empirical Research
    title_fr: Travail de recherche III — Recherche empirique originale
    type: project
    group: research-works
    requires:
      - research-work-2
    unlock_requirements:
      - Original research question
      - Strong experimental or empirical design
      - Multiple robustness checks
      - Statistical uncertainty treated seriously
      - Reproducible analysis
      - Formal peer-reviewed submission

  - id: research-controlled-investigations
    title: Controlled Research Investigations
    title_fr: Investigations de recherche contrôlées
    type: mastery
    group: research-works
    requires:
      - research-work-3

  - id: research-work-4
    title: Research Work IV — Original Contribution
    title_fr: Travail de recherche IV — Contribution originale
    type: boss
    group: research-works
    requires:
      - research-work-3
    description: >
      Produce a new method, extension, theorem, diagnostic,
      framework, or other substantive contribution rather than
      only comparing existing techniques.
    unlock_requirements:
      - Clear gap in the literature
      - Genuine original contribution
      - Strong comparison with existing work
      - Complete technical manuscript
      - Submission to a demanding peer-reviewed venue

  - id: research-r3-author
    title: Research Level III
    title_fr: Niveau de recherche III
    type: mastery
    group: research-works
    requires:
      - research-work-4

  - id: research-breadth
    title: Research Breadth
    title_fr: Diversité de recherche
    type: mastery
    group: research-works
    requires:
      - research-work-3
    unlock_requirements:
      - At least three substantial research programs
      - At least one actuarial or statistical program
      - At least one mathematically or computationally demanding program
      - Demonstrate transfer of research methods between domains

  - id: research-work-5
    title: Research Work V — Independent Research
    title_fr: Travail de recherche V — Recherche indépendante
    type: boss
    group: research-works
    requires:
      - research-work-4
      - research-breadth
    unlock_requirements:
      - Research question originated independently
      - Literature mapped independently
      - Methodology designed independently
      - Significant technical depth
      - External criticism addressed
      - Complete manuscript
      - Successful peer-reviewed publication or comparable strong external validation


