      - Understand protected and proxy variables
      - Compare predictive performance and fairness
      - Study calibration across groups
      - Identify conflicts between objectives
      - Formulate actuarially meaningful research questions

  - id: research-pricing-question-map
    title: P&C Pricing Research Questions
    title_fr: Questions de recherche en tarification IARD
    type: project
    group: actuarial-modeling
    program: pricing
    requires:
      - research-actuarial-anam
