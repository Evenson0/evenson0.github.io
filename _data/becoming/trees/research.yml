      - research-actuarial-calibration-fairness
    unlock_requirements:
      - Maintain at least ten nontrivial questions
      - Check which questions are already answered in the literature
      - Identify which questions require empirical work
      - Identify which may support an original contribution
      - Select the strongest candidate for Research Work I


