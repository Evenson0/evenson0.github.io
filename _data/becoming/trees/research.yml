  # ============================================================
  # QUANTITATIVE FINANCE
  # ============================================================

  - id: research-program-quant
    title: Quantitative Finance
    title_fr: Finance quantitative
    type: program
    group: programs
    status: dormant

  - id: research-pairs-foundations
    title: Pairs-Trading Foundations
    title_fr: Fondements du pairs trading
    type: foundation
    group: quant
    program: pairs
    status: dormant
    requires:
      - research-program-quant
    unlock_requirements:
      - Stationarity
      - Cointegration
      - Engle-Granger
