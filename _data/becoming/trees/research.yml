tree: research

title: Research
title_fr: Recherche

source_checked: 2026-08-28
state: active

current_focus:
  - research-craft
  - research-program-actuarial-modeling
  - research-actuarial-glm-tweedie

philosophy:
  - Research ability is developed through reading, reproduction, criticism, experimentation, and increasingly original work.
  - Research programs may run in parallel and do not form one artificial linear curriculum.
  - Reading should eventually change understanding, generate questions, or support technical work.
  - Future paper topics should emerge from previous work rather than be invented years in advance.
  - The five major research works should become progressively more original, independent, and externally serious.

nodes:

  # ============================================================
  # RESEARCH CRAFT
  # ============================================================

  - id: research-craft
    title: Research Craft
    title_fr: Pratique de la recherche
    type: foundation
    group: craft
    status: in_progress
    description: >
      Develop transferable research skills across actuarial science,
      statistics, probability, mathematics, and quantitative finance.

  - id: research-critical-reading
    title: Critical Reading
    title_fr: Lecture critique
    type: skill
    group: craft
    status: in_progress
    requires:
      - research-craft
    unlock_requirements:
      - Read at least six serious technical papers with structured notes
      - Identify the main question and contribution
      - Identify assumptions
      - Separate results from interpretation
      - Record limitations and open questions

  - id: research-literature-map
    title: Literature Map
    title_fr: Cartographie de la littérature
    type: project
    group: craft
    status: in_progress
    requires:
      - research-craft
    unlock_requirements:
      - Organize literature by research question
      - Identify foundational papers
      - Identify competing approaches
      - Track important citation relationships
      - Maintain a usable bibliography

  - id: research-reproduction-method
    title: Research Reproduction Method
    title_fr: Méthode de reproduction scientifique
    type: skill
    group: craft
    status: available
    requires:
      - research-critical-reading
    unlock_requirements:
      - Reconstruct methodology from the paper
      - Recreate the analysis or experiment
      - Compare reproduced and reported results
      - Explain important discrepancies
      - Record implementation assumptions

  - id: research-reproducibility
    title: Reproducible Research Workflow
    title_fr: Flux de recherche reproductible
    type: skill
    group: craft
    status: available
    requires:
      - research-craft
    unlock_requirements:
      - Explicit dependencies
      - Documented data source
      - Reproducible code
      - Figures generated from code
      - Clear project structure
      - Clear README

  - id: research-question-formulation
    title: Research Question Formulation
    title_fr: Formulation de questions de recherche
    type: skill
    group: craft
    status: available
    requires:
      - research-critical-reading
    unlock_requirements:
      - Maintain a research-question bank
      - At least ten nontrivial questions
      - Distinguish clarification questions from research questions
      - Identify why serious questions are not trivial
      - Identify a minimal investigation for promising questions

  - id: research-technical-writing
    title: Technical Research Writing
    title_fr: Écriture scientifique
    type: skill
    group: craft
    status: available
    requires:
      - research-critical-reading
    unlock_requirements:
      - State a precise question
      - Position relevant literature
      - Describe methodology clearly
      - Separate results and interpretation
      - State limitations
      - Use citations correctly


  # ============================================================
  # PROGRAM — P&C PRICING
  # ============================================================

  - id: research-program-actuarial-modeling
    title: P&C Pricing Research
    title_fr: Recherche en tarification IARD
    type: program
    group: programs
    status: in_progress
    description: >
      Study classical and modern insurance pricing models, their
      construction, validation, interpretability, fairness, stability,
      and practical limitations.

  - id: research-actuarial-glm-tweedie
    title: GLMs for Insurance Rating
    title_fr: GLM pour la tarification d'assurance
    type: advanced_study
    group: actuarial-modeling
    program: pricing
    status: in_progress
    requires:
      - research-program-actuarial-modeling
    description: >
      Study generalized linear models in the context of P&C insurance
      rating, including frequency, severity, pure premium, distributions,
      predictors, offsets, weights, and important limitations.
    unlock_requirements:
      - Understand random and systematic components
      - Understand link functions
      - Understand predictor treatment
      - Understand weights and offsets
      - Understand frequency and severity distributions
      - Understand Tweedie pure-premium modeling
      - Understand multicollinearity
      - Explain important GLM limitations

  - id: research-actuarial-glm-workflow
    title: Insurance GLM Model-Building Process
    title_fr: Processus de construction d'un GLM d'assurance
    type: skill
    group: actuarial-modeling
    program: pricing
    status: available
    requires:
      - research-actuarial-glm-tweedie
    unlock_requirements:
      - Define modeling objectives
      - Identify stakeholders
      - Prepare data
      - Conduct exploratory analysis
      - Specify model form
      - Evaluate model output
      - Validate the model
      - Understand the transition from model to rating product

  - id: research-actuarial-glm-model-form
    title: Insurance GLM Model Form
    title_fr: Forme d'un GLM d'assurance
    type: skill
    group: actuarial-modeling
    program: pricing
    requires:
      - research-actuarial-glm-workflow
    unlock_requirements:
      - Choose the target
      - Choose a distribution
      - Treat nonlinear continuous variables
      - Treat categorical variables
      - Understand splines and piecewise functions
      - Model interactions
      - Explain the consequences of these choices

  - id: research-actuarial-glm-refinement
    title: Insurance GLM Refinement
    title_fr: Amélioration d'un GLM d'assurance
    type: skill
    group: actuarial-modeling
    program: pricing
    requires:
      - research-actuarial-glm-model-form
    unlock_requirements:
      - Understand log-likelihood and deviance
      - Compare candidate models
      - Analyze residuals
      - Assess model stability
      - Identify overfitting or instability

  - id: research-actuarial-glm-validation
    title: Insurance GLM Validation
    title_fr: Validation d'un GLM d'assurance
    type: skill
    group: actuarial-modeling
    program: pricing
    requires:
      - research-actuarial-glm-refinement
    unlock_requirements:
      - Actual versus predicted analysis
      - Lift analysis
      - Double lift
      - Loss-ratio analysis
      - Gini where appropriate
      - Explain what validation does and does not establish

  - id: research-actuarial-glm-reproduction
    title: Reproduce an Insurance Pricing GLM
    title_fr: Reproduire un GLM de tarification
    type: project
    group: actuarial-modeling
    program: pricing
    requires:
      - research-actuarial-glm-validation
    unlock_requirements:
      - Use public or synthetic insurance data
      - Define a clear modeling target
      - Build a frequency, severity, or pure-premium GLM
      - Document data preparation
      - Justify distribution and link
      - Evaluate model form
      - Validate the model
      - Produce a reproducible notebook
      - Write a concise technical summary

  - id: research-pricing-flexible-models
    title: Flexible Alternatives to GLMs
    title_fr: Alternatives flexibles aux GLM
    type: advanced_study
    group: actuarial-modeling
    program: pricing
    requires:
      - research-actuarial-glm-reproduction
    unlock_requirements:
      - Understand GAMs
      - Understand regularized GLMs
      - Understand tree-based alternatives
      - Compare flexibility and tariff interpretability
      - Identify cases where additional complexity materially helps

  - id: research-actuarial-anam
    title: Actuarial Neural Additive Models
    title_fr: Modèles neuronaux additifs actuariels
    type: advanced_study
    group: actuarial-modeling
    program: pricing
    requires:
      - research-pricing-flexible-models
    description: >
      Study the Actuarial Neural Additive Model introduced by
      Laub, Pho, and Wong as a bridge between traditional transparent
      pricing models and flexible neural modeling.
    unlock_requirements:
      - Understand the additive architecture
      - Understand individual and interaction subnetworks
      - Understand sparsity
      - Understand smoothness constraints
      - Understand monotonicity constraints
      - Understand the empirical comparison with competing models
      - Reconstruct or reproduce a meaningful part of the methodology


  # ============================================================
  # INTERPRETABILITY
  # ============================================================

  - id: research-program-interpretability
    title: Interpretability in Insurance Pricing
    title_fr: Interprétabilité en tarification d'assurance
    type: program
    group: actuarial-modeling
    program: interpretability
    requires:
      - research-actuarial-glm-reproduction
    unlock_requirements:
      - Understand intrinsic versus post-hoc interpretation
      - Understand global versus local explanations
      - Understand model-specific versus model-agnostic approaches
      - Understand predictor-dependence problems
      - Relate interpretability to actuarial model governance

  - id: research-interpretability-taxonomy
    title: Interpretability Concepts and Taxonomy
    title_fr: Concepts et taxonomie de l'interprétabilité
    type: foundation
    group: actuarial-modeling
    program: interpretability
    requires:
      - research-program-interpretability
    unlock_requirements:
      - Define the object being explained
      - Define the intended audience
      - Distinguish local and global interpretation
      - Distinguish model behavior from causal mechanism
      - Formulate at least three serious questions

  - id: research-intrinsic-models
    title: Intrinsically Interpretable Models
    title_fr: Modèles intrinsèquement interprétables
    type: skill
    group: actuarial-modeling
    program: interpretability
    requires:
      - research-interpretability-taxonomy
    unlock_requirements:
      - Compare GLM, GAM, tree, and structured additive models
      - Explain intrinsic versus post-hoc interpretability
      - Discuss actuarial implications

  - id: research-pdp-ice
    title: PDP and ICE
    title_fr: PDP et ICE
    type: experiment
    group: actuarial-modeling
    program: interpretability
    requires:
      - research-interpretability-taxonomy
    unlock_requirements:
      - Reproducible experiment
      - PDP
      - ICE
      - Discussion of marginalization
      - Discussion of heterogeneity
      - Discussion of extrapolation
      - Discussion of predictor dependence

  - id: research-lime
    title: LIME
    title_fr: LIME
    type: experiment
    group: actuarial-modeling
    program: interpretability
    requires:
      - research-interpretability-taxonomy
    unlock_requirements:
      - Reproduce one local explanation
      - Explain surrogate fidelity
      - Critique perturbation strategy
      - Critique locality
      - Identify open questions

  - id: research-shapley-shap
    title: Shapley Values and SHAP
    title_fr: Valeurs de Shapley et SHAP
    type: experiment
    group: actuarial-modeling
    program: interpretability
    requires:
      - research-interpretability-taxonomy
    unlock_requirements:
      - Explain Shapley values from first principles
      - Explain the principal axioms
      - Implement a simple SHAP example
      - Explain attribution versus model effect
      - Explain the role of the reference distribution

  - id: research-ale
    title: ALE and Dependent Predictors
    title_fr: ALE et prédicteurs dépendants
    type: experiment
    group: actuarial-modeling
    program: interpretability
    requires:
      - research-pdp-ice
    unlock_requirements:
      - Correlated-data example
      - PDP versus ALE comparison
      - Figure showing disagreement
      - Explain why predictor dependence matters

  - id: research-evaluation-failure
    title: Failure Modes of Model Explanations
    title_fr: Limites des explications de modèles
    type: critical_study
    group: actuarial-modeling
    program: interpretability
    requires:
      - research-intrinsic-models
      - research-lime
      - research-shapley-shap
      - research-ale
    unlock_requirements:
      - Define faithfulness
      - Discuss stability
      - Discuss non-identifiability
      - Discuss explanation disagreement
      - Distinguish attribution from causation

  - id: research-unified-reproduction
    title: Compare Interpretation Methods on One Pricing Problem
    title_fr: Comparer les méthodes d'interprétation sur un même problème de tarification
    type: project
    group: actuarial-modeling
    program: interpretability
    requires:
      - research-evaluation-failure
    unlock_requirements:
      - Common dataset
      - Interpretable baseline
      - Flexible comparison model
      - PDP and ICE
      - LIME
      - SHAP
      - ALE
      - Reproducible environment

  - id: research-stress-test
    title: Stress-Test Model Explanations
    title_fr: Tester la sensibilité des explications
    type: experiment
    group: actuarial-modeling
    program: interpretability
    requires:
      - research-unified-reproduction
    unlock_requirements:
      - Correlated predictors
      - Redundant predictors
      - Nonlinear interaction
      - Data perturbation
      - Model retraining
      - Reference-sample sensitivity where relevant
      - Document meaningful disagreements

  - id: research-interpretability-memo
    title: Interpretability Research Memo
    title_fr: Note de recherche sur l'interprétabilité
    type: paper
    group: actuarial-modeling
    program: interpretability
    requires:
      - research-stress-test
    unlock_requirements:
      - Precise question
      - Literature
      - Method comparison
      - Reproduction
      - Dependence analysis
      - Failure modes
      - Actuarial implications
      - Limitations
      - Open questions

  - id: research-interpretability-complete
    title: Interpretability Study Complete
    title_fr: Étude sur l'interprétabilité terminée
    type: mastery
    group: actuarial-modeling
    program: interpretability
    requires:
      - research-interpretability-memo


  # ============================================================
