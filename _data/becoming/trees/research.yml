tree: research

title: Research
title_fr: Recherche

source_checked: 2026-08-28

state: active

current_focus:
  - research-craft
  - research-program-interpretability

philosophy:
  - "Research ability is demonstrated through evidence, not labels."
  - "Reading is not research until it changes understanding, produces a reproduction, or generates a serious question."
  - "Research programs may run in parallel and do not form one artificial linear curriculum."
  - "Topics for future original papers should emerge from previous work rather than be invented years in advance."
  - "No evidence, no unlock."

# ============================================================
# RESEARCH CRAFT
# ============================================================

nodes:

  - id: research-craft
    title: Research Craft
    title_fr: Pratique de la recherche
    type: foundation
    group: craft
    status: in_progress
    description: >
      Develop the transferable skills required to conduct independent
      research across actuarial science, statistics, probability,
      mathematics, and quantitative finance.
    description_fr: >
      Développer les compétences transférables nécessaires pour mener
      une recherche indépendante en actuariat, statistique, probabilités,
      mathématiques et finance quantitative.

  # ----------------------------------------------------------
  # Critical reading
  # ----------------------------------------------------------

  - id: research-critical-reading
    title: Critical Reading
    title_fr: Lecture critique
    type: skill
    group: craft
    status: in_progress
    requires:
      - research-craft
    description: >
      Read research papers by identifying the question, assumptions,
      mathematical structure, methodology, evidence, contribution,
      limitations, and unresolved questions.
    unlock_requirements:
      - At least six serious papers read with structured annotations
      - Identify the main claim of each paper
      - Identify important assumptions
      - Distinguish evidence from interpretation
      - Record limitations and unresolved questions
    evidence_required: true

  - id: research-literature-map
    title: Build an Annotated Literature Map
    title_fr: Construire une cartographie annotée de la littérature
    type: project
    group: craft
    status: in_progress
    requires:
      - research-craft
    unlock_requirements:
      - Organize papers by research question rather than only by chronology
      - Identify foundational papers
      - Identify competing methods or schools of thought
      - Track citations and connections between papers
      - Maintain a reproducible bibliography
    evidence_required: true

  # ----------------------------------------------------------
  # Reproduction
  # ----------------------------------------------------------

  - id: research-reproduction-method
    title: Research Reproduction Method
    title_fr: Méthode de reproduction scientifique
    type: skill
    group: craft
    status: available
    requires:
      - research-critical-reading
    description: >
      Learn to reconstruct a published result independently rather than
      merely execute code supplied by the authors.
    unlock_requirements:
      - Reconstruct the methodology from the paper
      - Document data provenance
      - Recreate the experiment
      - Compare reproduced and reported results
      - Explain meaningful discrepancies
      - Record implementation assumptions
    evidence_required: true

  - id: research-reproducibility
    title: Reproducible Research Workflow
    title_fr: Flux de recherche reproductible
    type: skill
    group: craft
    status: available
    requires:
      - research-craft
    unlock_requirements:
      - Reproducible code
      - Explicit dependencies
      - Documented data provenance
      - Deterministic seeds where appropriate
      - Figures generated from code
      - Clear README
      - Limitations documented
    evidence_required: true

  # ----------------------------------------------------------
  # Questions
  # ----------------------------------------------------------

  - id: research-question-formulation
    title: Research Question Formulation
    title_fr: Formulation de questions de recherche
    type: skill
    group: craft
    status: available
    requires:
      - research-critical-reading
    description: >
      Move from understanding published work to identifying questions
      that are precise, nontrivial, testable, and potentially useful.
    unlock_requirements:
      - Maintain a research question bank
      - At least ten nontrivial questions
      - Separate clarification questions from research questions
      - Identify why each serious question is not trivial
      - Identify a minimal experiment for promising questions
    evidence_required: true

  # ----------------------------------------------------------
  # Writing
  # ----------------------------------------------------------

  - id: research-technical-writing
    title: Technical Research Writing
    title_fr: Écriture scientifique
    type: skill
    group: craft
    status: available
    requires:
      - research-critical-reading
    unlock_requirements:
      - Write a precise research question
      - Present related literature
      - Describe methodology reproducibly
      - Separate results from interpretation
      - State limitations explicitly
      - Use citations correctly
    evidence_required: true


# ============================================================
# PROGRAM 1 — ACTUARIAL MODELING
# ============================================================

  - id: research-program-actuarial-modeling
    title: Actuarial Modeling
    title_fr: Modélisation actuarielle
    type: program
    group: programs
    status: in_progress
    description: >
      Study modern statistical and machine-learning approaches for
      insurance modeling, with particular attention to interpretability,
      calibration, model structure, fairness, and deployability.

  # ==========================================================
  # ACTIVE SUBPROGRAM — INTERPRETABILITY
  # ==========================================================

  - id: research-program-interpretability
    title: Model Interpretability
    title_fr: Interprétabilité des modèles
    type: program
    group: actuarial-modeling
    program: interpretability
    status: in_progress
    requires:
      - research-program-actuarial-modeling
    description: >
      Develop a rigorous understanding of interpretable models,
      post-hoc explanations, feature effects, feature attribution,
      explanation stability, and their actuarial implications.

  - id: research-interpretability-taxonomy
    title: Interpretability Taxonomy
    title_fr: Taxonomie de l'interprétabilité
    type: foundation
    group: actuarial-modeling
    program: interpretability
    status: in_progress
    requires:
      - research-program-interpretability
    description: >
      Define audience, object, local/global scope, model behavior versus
      causal mechanism, and the decision an explanation must support.
    description_fr: >
      Définir le public, l'objet, la portée locale/globale,
      le comportement du modèle par opposition au mécanisme causal,
      et la décision que l'explication doit soutenir.
    readings:
      - molnar-iml-book
      - molnar-history-challenges
    unlock_requirements:
      - Annotated literature map
      - Technical note
      - At least three nontrivial research questions
    evidence_required: true

  - id: research-intrinsic-models
    title: Interpretable Models by Construction
    title_fr: Modèles interprétables par construction
    type: skill
    group: actuarial-modeling
    program: interpretability
    status: locked
    requires:
      - research-interpretability-taxonomy
    readings:
      - molnar-iml-book
      - rudin-black-box
    unlock_requirements:
      - Compare GLM, GAM, decision tree, and explained black box
      - Explain the difference between intrinsic and post-hoc interpretability
      - Include actuarial pricing implications
    evidence_required: true

  - id: research-pdp-ice
    title: PDP and ICE Experiment
    title_fr: Expérience PDP et ICE
    type: experiment
    group: actuarial-modeling
    program: interpretability
    status: locked
    requires:
      - research-interpretability-taxonomy
    unlock_requirements:
      - Public or synthetic data
      - Reproducible notebook
      - At least one figure
      - Discussion of marginalization
      - Discussion of heterogeneity
      - Discussion of extrapolation
      - Discussion of predictor dependence
    evidence_required: true

  - id: research-lime
    title: LIME Reproduction
    title_fr: Reproduction de LIME
    type: experiment
    group: actuarial-modeling
    program: interpretability
    status: locked
    requires:
      - research-interpretability-taxonomy
    readings:
      - ribeiro-lime
    unlock_requirements:
      - One reproduced local explanation
      - Explain surrogate fidelity
      - Critique perturbation strategy
      - Critique locality definition
      - At least two open questions
    evidence_required: true

  - id: research-shapley-shap
    title: Shapley Values and SHAP
    title_fr: Valeurs de Shapley et SHAP
    type: experiment
    group: actuarial-modeling
    program: interpretability
    status: locked
    requires:
      - research-interpretability-taxonomy
    readings:
      - lundberg-lee-shap
    unlock_requirements:
      - Explain Shapley values from first principles
      - Explain the main Shapley axioms
      - Implement a simple SHAP example
      - Explain attribution versus model effect
      - Document the role of the reference/background distribution
    evidence_required: true

  - id: research-ale
    title: ALE and Dependent Predictors
    title_fr: ALE et prédicteurs dépendants
    type: experiment
    group: actuarial-modeling
    program: interpretability
    status: locked
    requires:
      - research-pdp-ice
    readings:
      - apley-zhu-ale
    unlock_requirements:
      - Correlated synthetic example
      - PDP versus ALE comparison
      - ICE where informative
      - Figure showing disagreement
      - Explain why predictor dependence matters
    evidence_required: true

  - id: research-evaluation-failure
    title: Failure and Evaluation of Explanations
    title_fr: Échec et évaluation des explications
    type: critical_study
    group: actuarial-modeling
    program: interpretability
    status: locked
    requires:
      - research-intrinsic-models
      - research-lime
      - research-shapley-shap
      - research-ale
    readings:
      - rudin-black-box
      - rudin-grand-challenges
      - molnar-history-challenges
    unlock_requirements:
      - Critical memo
      - Define faithfulness
      - Define stability
      - Discuss high-stakes decisions
      - Identify non-identifiability
      - Identify explanation disagreement
    evidence_required: true

  - id: research-unified-reproduction
    title: Unified Interpretability Reproduction
    title_fr: Reproduction unifiée en interprétabilité
    type: project
    group: actuarial-modeling
    program: interpretability
    status: locked
    requires:
      - research-evaluation-failure
    unlock_requirements:
      - Interpretable baseline
      - Nonlinear comparison model
      - PDP
      - ICE
      - LIME
      - SHAP
      - ALE
      - Permutation importance where appropriate
      - README
      - Reproducible environment
    evidence_required: true

  - id: research-stress-test
    title: Explanation Stability Stress Test
    title_fr: Test de robustesse des explications
    type: experiment
    group: actuarial-modeling
    program: interpretability
    status: locked
    requires:
      - research-unified-reproduction
    unlock_requirements:
      - Correlated predictors
      - Redundant predictors
      - Nonlinear interaction
      - Data perturbation
      - Model retraining
      - Reference-sample sensitivity where relevant
      - Document meaningful disagreements
    evidence_required: true

  - id: research-interpretability-memo
    title: Interpretability Foundations Research Memo
    title_fr: Mémoire de recherche — Fondations de l'interprétabilité
    type: paper
    group: actuarial-modeling
