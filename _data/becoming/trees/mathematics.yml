tree: mathematics

title: Mathematics
title_fr: Mathématiques

state: dormant

philosophy:
  - "Mathematical progress is demonstrated through proof, explanation, problem solving, and independent investigation."
  - "Different mathematical domains develop in parallel; one specialization should not artificially block another."
  - "Reading advanced mathematics is not mastery unless the material can be reconstructed, used, and explained."
  - "Computational experiments may generate conjectures, but they do not replace proof."
  - "The long-term objective is mathematical independence, not completion of a predefined syllabus."

nodes:

  - id: mathematics-maturity
    title: Mathematical Maturity
    title_fr: Maturité mathématique
    type: foundation
    status: dormant
    unlock_requirements:
      - Read definitions and hypotheses precisely
      - Construct direct and indirect proofs
      - Use contradiction and contrapositive correctly
      - Produce useful examples and counterexamples
      - Distinguish numerical or empirical support from proof
      - Explain a proof independently

  - id: mathematics-proof-writing
    title: Proof Writing
    title_fr: Rédaction de preuves
    type: skill
    status: dormant
    requires:
      - mathematics-maturity
    unlock_requirements:
      - Direct proof
      - Contrapositive proof
      - Contradiction proof
      - Induction
      - Existence proof
      - Uniqueness proof
      - Proof involving a carefully chosen counterexample

  - id: mathematics-problem-solving
    title: Mathematical Problem Solving
    title_fr: Résolution de problèmes mathématiques
    type: skill
    status: dormant
    requires:
      - mathematics-maturity
    unlock_requirements:
      - Break a problem into lemmas
      - Test small cases
      - Search for invariants
      - Reformulate the problem
      - Use computation without confusing it with proof
      - Document failed approaches

  - id: mathematics-exposition
