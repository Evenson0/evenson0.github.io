tree: mathematics

title: Mathematics
title_fr: Mathématiques

state: dormant

philosophy:
  - "Mathematical progress is demonstrated through proof, explanation, problem solving, and independent investigation."
  - "Different mathematical domains develop in parallel; one specialization should not artificially block another."
  - "Reading advanced mathematics is not mastery unless the material can be reconstructed, used, and explained."
  - "Computational experiments may generate conjectures, but they do not replace proof."
  - "The long-term objective is mathematical independence, not completion of a predefined syllabus."

nodes:

  # ============================================================
  # MATHEMATICAL CRAFT
  # ============================================================

  - id: mathematics-maturity
    title: Mathematical Maturity
    title_fr: Maturité mathématique
    type: foundation
    status: dormant
    description: >
      Develop the habits required for serious mathematics: read definitions
      precisely, distinguish hypotheses from conclusions, construct proofs,
      search for counterexamples, and recognize mathematical structure.
    description_fr: >
      Développer les habitudes nécessaires aux mathématiques sérieuses :
      lire précisément les définitions, distinguer hypothèses et conclusions,
      construire des preuves, chercher des contre-exemples et reconnaître
      les structures mathématiques.
    unlock_requirements:
      - Read definitions and hypotheses precisely
      - Construct direct and indirect proofs
      - Use contradiction and contrapositive correctly
      - Produce useful examples and counterexamples
      - Distinguish evidence from proof
      - Explain a proof independently
    evidence_required: true

  - id: mathematics-proof-writing
    title: Proof Writing
    title_fr: Rédaction de preuves
    type: skill
    status: dormant
    requires:
      - mathematics-maturity
    description: >
      Write complete mathematical arguments whose logical structure can
      be checked line by line.
    description_fr: >
      Rédiger des arguments mathématiques complets dont la structure
      logique peut être vérifiée ligne par ligne.
    unlock_requirements:
      - Direct proof
      - Contrapositive proof
      - Contradiction proof
      - Induction
      - Existence proof
      - Uniqueness proof
      - Proof involving a carefully chosen counterexample
    evidence_required: true

  - id: mathematics-problem-solving
    title: Mathematical Problem Solving
    title_fr: Résolution de problèmes mathématiques
    type: skill
    status: dormant
    requires:
      - mathematics-maturity
    description: >
      Develop strategies for approaching unfamiliar problems rather than
      only applying known formulas or standard templates.
    description_fr: >
      Développer des stratégies pour aborder des problèmes inconnus plutôt
      que d'appliquer uniquement des formules ou modèles familiers.
    unlock_requirements:
      - Break a problem into lemmas
      - Test small cases
      - Search for invariants
      - Reformulate the problem
      - Use computation without confusing it with proof
      - Document failed approaches
    evidence_required: true

  - id: mathematics-exposition
    title: Mathematical Exposition
    title_fr: Exposition mathématique
    type: skill
    status: dormant
    requires:
      - mathematics-proof-writing
    description: >
      Explain mathematical ideas clearly while preserving rigor,
      motivation, examples, and logical structure.
    description_fr: >
      Expliquer clairement des idées mathématiques tout en conservant
      la rigueur, la motivation, les exemples et la structure logique.
    evidence:
      - type: publication
        title: Evenson's Mathematical Workshop
        url: /publication/evenson-mathematical-workshop
        visibility: public
    unlock_requirements:
      - State definitions clearly
      - Motivate the problem
      - Separate intuition from proof
      - Give meaningful examples
      - Present a complete argument
    evidence_required: true


  # ============================================================
  # PROGRAM — ANALYSIS
  # ============================================================

  - id: mathematics-analysis
    title: Rigorous Analysis
    title_fr: Analyse rigoureuse
    type: program
    status: dormant
    requires:
      - mathematics-maturity
    description: >
      Develop rigorous command of limits, continuity, sequences,
      series, differentiation, integration, and the structure of
      the real numbers.
    description_fr: >
      Développer une maîtrise rigoureuse des limites, de la continuité,
      des suites, des séries, de la dérivation, de l'intégration et
      de la structure des nombres réels.
    unlock_requirements:
      - Real-number completeness
      - Sequences and limits
      - Continuity
      - Compactness
      - Differentiation
      - Riemann integration
      - Series and convergence
      - Nontrivial proof portfolio
    evidence_required: true

  - id: mathematics-measure
    title: Measure and Integration
    title_fr: Mesure et intégration
    type: skill
    status: dormant
    requires:
      - mathematics-analysis
    description: >
      Build the measure-theoretic foundation needed for modern probability
      and advanced analysis.
    description_fr: >
      Construire les fondements de théorie de la mesure nécessaires
      aux probabilités modernes et à l'analyse avancée.
    unlock_requirements:
      - Sigma-algebras
      - Measures
      - Measurable functions
      - Lebesgue integral
      - Convergence theorems
      - Product measures
    evidence_required: true


  # ============================================================
  # PROGRAM — PROBABILITY
  # ============================================================

  - id: mathematics-probability
    title: Probability Theory
    title_fr: Théorie des probabilités
    type: program
    status: dormant
    requires:
      - mathematics-measure
    description: >
      Study probability as a mathematical theory rather than only
      as a collection of computational techniques.
    description_fr: >
      Étudier les probabilités comme théorie mathématique plutôt que
      comme simple collection de techniques de calcul.
    unlock_requirements:
      - Probability spaces
      - Random variables
      - Expectation as integration
      - Modes of convergence
      - Conditional expectation
      - Laws of large numbers
      - Central limit theorem
    evidence_required: true

  - id: mathematics-stochastic
    title: Stochastic Processes
    title_fr: Processus stochastiques
    type: skill
    status: dormant
    requires:
      - mathematics-probability
    description: >
      Study random evolution through Markov chains, martingales,
      Poisson processes, and other foundational stochastic processes.
    description_fr: >
      Étudier l'évolution aléatoire à travers les chaînes de Markov,
      les martingales, les processus de Poisson et d'autres processus
      stochastiques fondamentaux.
    unlock_requirements:
      - Discrete-time Markov chains
      - Poisson processes
      - Martingales
      - Stopping times
      - Basic convergence results
      - At least one substantial simulation or proof project
    evidence_required: true

  - id: mathematics-applied-probability
    title: Advanced Applied Probability
    title_fr: Probabilités appliquées avancées
    type: advanced_study
    status: dormant
    requires:
      - mathematics-stochastic
    description: >
      Apply rigorous probability to actuarial, stochastic-modeling,
      queueing, Monte Carlo, reliability, or related problems.
    description_fr: >
      Appliquer les probabilités rigoureuses à des problèmes actuariels,
      de modélisation stochastique, files d'attente, Monte-Carlo,
      fiabilité ou domaines connexes.
    evidence_required: true


  # ============================================================
  # PROGRAM — ALGEBRA
  # Important for deeper number theory
  # ============================================================

  - id: mathematics-algebra
    title: Abstract Algebra Foundations
    title_fr: Fondements d'algèbre abstraite
    type: program
    status: dormant
    requires:
      - mathematics-maturity
    description: >
      Build fluency with groups, rings, fields, homomorphisms,
      quotient structures, and algebraic reasoning.
    description_fr: >
      Développer une maîtrise des groupes, anneaux, corps, morphismes,
      structures quotient et du raisonnement algébrique.
    unlock_requirements:
      - Groups and subgroups
      - Homomorphisms
      - Quotient groups
      - Rings and ideals
      - Polynomial rings
      - Fields
      - Structural proofs
    evidence_required: true


  # ============================================================
  # PROGRAM — NUMBER THEORY
  # ============================================================

  - id: mathematics-number-theory-foundations
    title: Number Theory Foundations
    title_fr: Fondements de la théorie des nombres
    type: program
    status: dormant
    requires:
      - mathematics-maturity
    description: >
      Develop rigorous command of divisibility, primes, the Euclidean
      algorithm, unique factorization, and classical number-theoretic proofs.
    description_fr: >
      Développer une maîtrise rigoureuse de la divisibilité, des nombres
      premiers, de l'algorithme d'Euclide, de la factorisation unique
      et des preuves classiques de théorie des nombres.
    unlock_requirements:
      - Divisibility
      - Euclidean algorithm
      - Bézout identity
      - Prime numbers
      - Fundamental theorem of arithmetic
      - Classical proof techniques
    evidence_required: true

  - id: mathematics-congruences
    title: Congruences and Arithmetic Functions
    title_fr: Congruences et fonctions arithmétiques
    type: skill
    status: dormant
    requires:
      - mathematics-number-theory-foundations
    description: >
      Work fluently with modular arithmetic, the Chinese remainder
      theorem, Euler's theorem, arithmetic functions, and multiplicativity.
    description_fr: >
      Travailler couramment avec l'arithmétique modulaire, le théorème
      chinois des restes, le théorème d'Euler, les fonctions arithmétiques
      et la multiplicativité.
    unlock_requirements:
      - Linear congruences
      - Chinese remainder theorem
      - Fermat's little theorem
      - Euler's theorem
      - Euler phi function
      - Möbius function
      - Multiplicative functions
    evidence_required: true

  - id: mathematics-diophantine
    title: Diophantine Equations
    title_fr: Équations diophantiennes
    type: skill
    status: dormant
    requires:
      - mathematics-congruences
    description: >
      Study integer and rational solutions using congruences, descent,
      factorization, valuations, and other appropriate techniques.
    description_fr: >
      Étudier les solutions entières et rationnelles au moyen des
      congruences, de la descente, de la factorisation, des valuations
      et d'autres techniques appropriées.
    unlock_requirements:
      - Linear Diophantine equations
      - Pythagorean triples
      - Congruence obstructions
      - Infinite descent
      - Selected nonlinear equations
      - Examples of local versus global obstruction
    evidence_required: true

  - id: mathematics-number-theory-computation
    title: Computational Number Theory Exploration
    title_fr: Exploration computationnelle en théorie des nombres
    type: experiment
    status: dormant
    requires:
      - mathematics-congruences
      - mathematics-problem-solving
    description: >
      Use computation to explore patterns, test conjectures, search for
      counterexamples, and generate mathematical questions without treating
      numerical evidence as proof.
    description_fr: >
      Utiliser le calcul pour explorer des structures, tester des conjectures,
      chercher des contre-exemples et générer des questions mathématiques
      sans confondre preuve numérique et démonstration.
    unlock_requirements:
      - Reproducible computation
      - Explicit conjecture or question
      - Search for counterexamples
      - Mathematical interpretation
      - Clear distinction between experiment and proof
    evidence_required: true

  - id: mathematics-number-theory-advanced
    title: Advanced Number Theory Study
    title_fr: Étude avancée de la théorie des nombres
    type: advanced_study
    status: dormant
    requires:
      - mathematics-diophantine
      - mathematics-number-theory-computation
    description: >
      Complete a serious independent study in one advanced direction:
      analytic, algebraic, probabilistic, or computational number theory.
      Additional prerequisites depend on the selected direction.
    description_fr: >
      Réaliser une étude indépendante sérieuse dans une direction avancée :
      théorie analytique, algébrique, probabiliste ou computationnelle
      des nombres. Les prérequis supplémentaires dépendent de la direction choisie.
    notes: >
      Do not hard-code mathematics-analysis as a universal prerequisite.
      Analytic number theory may require analysis; algebraic number theory
      may instead require abstract algebra. Add the relevant dependency
      when the direction is selected.
    evidence_required: true

  - id: mathematics-number-theory-exposition
    title: Number Theory Proof Portfolio
    title_fr: Portfolio de preuves en théorie des nombres
    type: project
    status: dormant
    requires:
      - mathematics-diophantine
      - mathematics-exposition
    description: >
      Produce a polished collection of nontrivial number-theoretic proofs,
      solved problems, expository notes, and at least one computational
      or theoretical exploration.
    description_fr: >
      Produire une collection soignée de preuves non triviales en théorie
      des nombres, de problèmes résolus, de notes d'exposition et d'au moins
      une exploration computationnelle ou théorique.
    unlock_requirements:
      - At least ten polished proofs
      - At least one substantial expository note
      - At least one difficult solved problem
      - At least one computational or theoretical exploration
      - Revisions after criticism
    evidence_required: true


  # ============================================================
  # INDEPENDENT MATHEMATICAL STUDY
  # ============================================================

  - id: mathematics-independent-reading
    title: Graduate-Level Independent Study
    title_fr: Étude indépendante de niveau supérieur
    type: advanced_study
    status: dormant
    requires:
      - mathematics-proof-writing
      - mathematics-problem-solving
    description: >
      Complete an advanced mathematical text or focused reading program
      independently and demonstrate understanding through proofs,
      exercises, exposition, and synthesis.
    description_fr: >
      Compléter de manière autonome un texte mathématique avancé ou un
      programme de lecture ciblé et démontrer sa compréhension par des
      preuves, exercices, exposition et synthèse.
    unlock_requirements:
      - Reading plan
      - Core definitions reconstructed independently
      - Selected theorems proved or reconstructed
      - Nontrivial exercises solved
      - Final synthesis note
    evidence_required: true

  - id: mathematics-domain-study
    title: Complete an Advanced Mathematical Domain Study
    title_fr: Compléter une étude mathématique avancée
    type: mastery
    status: dormant
    requires:
      - mathematics-independent-reading
    description: >
      Demonstrate depth in at least one advanced mathematical domain.
      The domain may be probability, number theory, analysis, algebra,
      or another sufficiently rigorous field.
    description_fr: >
      Démontrer une profondeur réelle dans au moins un domaine mathématique
      avancé. Le domaine peut être les probabilités, la théorie des nombres,
      l'analyse, l'algèbre ou un autre domaine suffisamment rigoureux.
    evidence_required: true


  # ============================================================
  # PROOF / EXPOSITION PORTFOLIO
  # ============================================================

  - id: mathematics-proof-portfolio
    title: Proof and Exposition Portfolio
    title_fr: Portfolio de preuves et d'exposition
    type: project
    status: dormant
    requires:
      - mathematics-proof-writing
      - mathematics-exposition
    description: >
      Build a public body of mathematical work demonstrating proof,
      exposition, problem solving, and increasing mathematical depth.
    description_fr: >
      Construire un corpus public de travaux mathématiques démontrant
      la capacité de preuve, d'exposition, de résolution de problèmes
      et une profondeur mathématique croissante.
    unlock_requirements:
      - Multiple polished proofs
      - Multiple mathematical topics represented
      - Nontrivial problems
      - Clear exposition
      - Corrections and revisions preserved
    evidence:
      - type: publication
        title: Evenson's Mathematical Workshop
        url: /publication/evenson-mathematical-workshop
        visibility: public
    evidence_required: true


  # ============================================================
  # REPRODUCTION → INVESTIGATION
  # ============================================================

  - id: mathematics-reproduce-result
    title: Reproduce a Nontrivial Mathematical Result
    title_fr: Reproduire un résultat mathématique non trivial
    type: project
    status: dormant
    requires:
      - mathematics-proof-portfolio
      - mathematics-domain-study
    description: >
      Independently reconstruct a substantial theorem, argument,
      derivation, or mathematical result from the literature.
    description_fr: >
      Reconstruire indépendamment un théorème, argument, développement
      ou résultat mathématique substantiel provenant de la littérature.
    unlock_requirements:
      - Original source identified
      - Definitions and assumptions understood
      - Proof reconstructed independently
      - Missing steps filled
      - Alternative examples or counterexamples explored
      - Exposition written in own words
    evidence_required: true

  - id: mathematics-extend-result
    title: Extend or Stress-Test a Mathematical Result
    title_fr: Étendre ou tester les limites d'un résultat mathématique
    type: project
    status: dormant
    requires:
      - mathematics-reproduce-result
    description: >
      Change an assumption, test a boundary case, generalize a statement,
      construct a counterexample, or investigate a neighboring problem.
    description_fr: >
      Modifier une hypothèse, tester un cas limite, généraliser un énoncé,
      construire un contre-exemple ou étudier un problème voisin.
    unlock_requirements:
      - Precise extension question
      - Failed approaches documented
      - Examples and counterexamples explored
      - Clear statement of what is and is not established
    evidence_required: true

  - id: mathematics-original-investigation
    title: Independent Mathematical Investigation
    title_fr: Investigation mathématique indépendante
    type: boss
    status: dormant
    requires:
      - mathematics-extend-result
    description: >
      Conduct a sustained mathematical investigation whose direction,
      conjectures, experiments, proofs, failures, and conclusions are
      substantially self-directed.
    description_fr: >
      Mener une investigation mathématique soutenue dont la direction,
      les conjectures, expériences, preuves, échecs et conclusions sont
      largement déterminés de manière autonome.
    unlock_requirements:
      - Original or independently formulated question
      - Relevant literature reviewed
      - Mathematical experiments or examples
      - Serious proof attempts
      - Failed approaches documented
      - At least one nontrivial result, counterexample, or rigorous conclusion
      - Complete written exposition
      - External mathematical feedback
    evidence_required: true
